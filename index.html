<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pawsly Gourmet — Order at the Venue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:ital,wght@0,400;0,600;0,700;0,900;1,400&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --ink:#12351F;
  --ink-2:#1D5435;
  --ink-3:#2F6B45;
  --cream:#FDF1DC;
  --cream-2:#FAE4C2;
  --bone:#FFFBF2;
  --marigold:#E89C2A;
  --marigold-dk:#C87A14;
  --line:rgba(18,53,31,.16);
  --line-strong:rgba(18,53,31,.32);
  --text:#12351F;
  --text-soft:#4A6B57;
  --surface:#FFFBF2;
  --page:#FDF1DC;
  --panel:#FAE4C2;
  --pill-text:#FFFBF2;
  --on-ink-accent:#E89C2A;
  --good:#1D7A4C;
  --warn:#B8701A;
  --bad:#A33327;
  --shadow:0 2px 0 rgba(18,53,31,.10);
  --r-s:10px; --r-m:18px; --r-l:28px;
  --display:"Baloo 2", ui-rounded, "SF Pro Rounded", "Trebuchet MS", system-ui, sans-serif;
  --body:"Nunito Sans", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --ink:#F2E4C9;
    --ink-2:#8FD4A8;
    --ink-3:#6FBE8C;
    --cream:#0E2316;
    --cream-2:#17301F;
    --bone:#14291B;
    --marigold:#F0A93C;
    --marigold-dk:#E89C2A;
    --line:rgba(242,228,201,.18);
    --line-strong:rgba(242,228,201,.34);
    --text:#F2E4C9;
    --text-soft:#A8BFAF;
    --surface:#14291B;
    --page:#0E2316;
    --panel:#17301F;
    --pill-text:#0E2316;
    --on-ink-accent:#7A4A00;
    --good:#6FD39A;
    --warn:#F0A93C;
    --bad:#E88877;
    --shadow:0 2px 0 rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  overflow-x:hidden;
  background:var(--page);
  color:var(--text);
  font-family:var(--body);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--ink-2)}
:focus-visible{outline:3px solid var(--marigold);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.wrap{max-width:560px;margin:0 auto;padding:0 16px 120px}
@media(max-width:420px){.wrap{padding:0 12px 120px}}
.wrap.wide{max-width:1040px}
.hidden{display:none!important}

/* ---------- venue ribbon ---------- */
.ribbon{
  background:var(--ink);color:var(--pill-text);
  padding:8px 16px;font-size:13.5px;font-weight:700;
  display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap;
}
.ribbon .dot{width:7px;height:7px;border-radius:50%;background:var(--marigold);flex:none}
.ribbon small{font-weight:600;opacity:.75}

/* ---------- masthead ---------- */
.mast{text-align:center;padding:18px 0 10px}
.logo{
  font-family:var(--display);font-weight:800;font-size:44px;line-height:.9;
  letter-spacing:-.02em;color:var(--ink);margin:0;
}
.logo .paws{display:block;font-size:14px;letter-spacing:.3em;margin-bottom:2px;color:var(--ink-2)}
.tag{font-size:11px;letter-spacing:.18em;font-weight:700;color:var(--text-soft);margin:4px 0 0;text-transform:uppercase}
.h1{
  font-family:var(--display);font-weight:800;font-size:clamp(28px,8vw,40px);
  line-height:1;margin:18px 0 4px;color:var(--ink);
}
.lede{color:var(--text-soft);margin:0 auto;max-width:44ch;font-size:15px}

/* ---------- step heading ---------- */
.step{display:flex;align-items:baseline;gap:10px;margin:32px 0 12px}
.step b{
  font-family:var(--display);font-size:22px;font-weight:800;color:var(--ink);line-height:1.1
}
.step i{
  font-style:normal;font-size:12.5px;font-weight:700;color:var(--marigold-dk);
  background:var(--cream-2);border-radius:999px;padding:3px 9px;white-space:nowrap
}

/* ---------- size cards ---------- */
.sizes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:380px){.size .sub{display:none}}
.size{
  background:var(--surface);border:2px solid var(--line);border-radius:var(--r-m);
  padding:12px 8px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;
  transition:border-color .12s, transform .12s;
}
.size[aria-pressed="true"]{border-color:var(--ink);background:var(--cream-2)}
.size[aria-pressed="true"] .bowl{transform:translateY(-2px)}
.size .nm{font-family:var(--display);font-weight:800;font-size:17px;color:var(--ink);line-height:1}
.size .px{font-weight:900;font-size:13.5px;color:var(--ink-2)}
.size .sub{font-size:10.5px;color:var(--text-soft);line-height:1.25;min-height:2.4em}

/* drawn bowl */
.bowl{display:block;position:relative;width:100%;max-width:86px;aspect-ratio:1/.78;transition:transform .15s}
.bowl .food{
  position:absolute;left:14%;right:14%;top:4%;height:34%;
  border-radius:50% 50% 40% 40%;
  background:
    radial-gradient(circle at 20% 60%, #6E8F3F 0 14%, transparent 15%),
    radial-gradient(circle at 46% 36%, #8C5A2B 0 17%, transparent 18%),
    radial-gradient(circle at 70% 62%, #E07B2A 0 13%, transparent 14%),
    radial-gradient(circle at 33% 22%, #D9A441 0 11%, transparent 12%),
    radial-gradient(circle at 82% 34%, #4F7A33 0 10%, transparent 11%),
    #A9762F;
}
.bowl .body{
  position:absolute;left:4%;right:4%;top:28%;bottom:0;
  background:linear-gradient(180deg,var(--bone) 0%, var(--cream-2) 100%);
  border:2px solid var(--line-strong);
  border-radius:12px 12px 46% 46% / 8px 8px 60% 60%;
  clip-path:polygon(0 0,100% 0,88% 100%,12% 100%);
}
.bowl .mark{
  position:absolute;left:0;right:0;top:52%;text-align:center;
  font-family:var(--display);font-weight:800;font-size:11px;color:var(--ink);opacity:.75
}
.size.s .bowl{max-width:62px}
.size.m .bowl{max-width:76px}
.size.l .bowl{max-width:92px}
.bowlimg{display:block;width:100%;height:auto}
.size.s .bowlimg{max-width:84px}
.size.m .bowlimg{max-width:100px}
.size.l .bowlimg{max-width:116px}

/* ---------- recipe chips ---------- */
.recipes{display:grid;gap:10px}
.recipe{
  display:flex;gap:12px;align-items:center;text-align:left;width:100%;
  background:var(--surface);border:2px solid var(--line);border-radius:var(--r-m);padding:12px 14px
}
.recipe:hover{border-color:var(--line-strong)}
.recipe .n{
  flex:none;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--pill-text);
  display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:16px
}
.recipe .t{font-family:var(--display);font-weight:700;font-size:17px;color:var(--ink);line-height:1.15}
.recipe .d{font-size:12.5px;color:var(--text-soft)}

/* ---------- ingredient groups ---------- */
.group{margin:18px 0 0;background:var(--surface);border:2px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.group > header{
  background:var(--ink);color:var(--pill-text);padding:9px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px
}
.group > header h3{font-family:var(--display);font-weight:700;font-size:16px;margin:0;letter-spacing:.01em}
.group > header span{font-size:12px;font-weight:700;opacity:.8}
.group.full > header span{color:var(--on-ink-accent);opacity:1;font-weight:900}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px;padding:12px 8px}
.pick{
  display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 2px 9px;
  border:2px solid transparent;border-radius:14px;transition:border-color .12s,background .12s
}
.pick[aria-pressed="true"]{border-color:var(--ink);background:var(--cream-2)}
.pick[disabled]{opacity:.34}
.pick .med{
  display:block;width:62px;height:62px;border-radius:50%;background:var(--bone);
  border:2px solid var(--line);position:relative;overflow:hidden;flex:none
}
.pick[aria-pressed="true"] .med{border-color:var(--ink)}
.pick .lb{font-size:12px;font-weight:700;line-height:1.2;text-align:center;color:var(--text);hyphens:auto}
.pick .chk{
  position:absolute;right:-2px;top:-2px;width:20px;height:20px;border-radius:50%;
  background:var(--marigold);color:#12351F;font-size:12px;font-weight:900;display:none;place-items:center;
  box-shadow:0 0 0 2px var(--surface)
}
.pick[aria-pressed="true"] .chk{display:grid}
.medwrap{position:relative;display:inline-block;line-height:0}

/* ---------- addons ---------- */
.snackrow{
  display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;
  padding:2px 2px 12px;margin:0 -2px;-webkit-overflow-scrolling:touch;
  scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent;
}
.snackrow::-webkit-scrollbar{height:6px}
.snackrow::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:3px}
.snack{
  min-width:0;
  background:var(--surface);border:2px solid var(--line);border-radius:var(--r-m);
  padding:12px 12px 10px;display:flex;flex-direction:column;gap:6px;
}
.snack.on{border-color:var(--ink);background:var(--cream-2)}
.snack.soon{opacity:.72}
.snack.soon .step2 .add{background:transparent;color:var(--text-soft);border:2px dashed var(--line-strong)}
.snack .pic{
  display:block;width:100%;aspect-ratio:1/1;border-radius:12px;background-color:var(--bone);
  border:1px solid var(--line);overflow:hidden
}
.snack .pic img{display:block;width:100%;height:100%;object-fit:cover}
.snack .nm{font-weight:800;font-size:13.5px;line-height:1.2;color:var(--text)}
.snack .ds{font-size:11.5px;color:var(--text-soft);line-height:1.25}
.snack .pr{font-weight:900;font-size:13.5px;color:var(--ink-2);margin-top:auto}
.step2{display:flex;align-items:center;gap:8px;margin-top:4px}
.step2 button{
  width:34px;height:34px;border-radius:50%;border:2px solid var(--line-strong);
  font-weight:900;font-size:17px;color:var(--ink);display:grid;place-items:center;flex:none
}
.step2 button:disabled{opacity:.3}
.step2 .qty{font-weight:900;font-size:15px;min-width:20px;text-align:center}
.step2 .add{flex:1;width:auto;border-radius:999px;background:var(--ink);color:var(--pill-text);border-color:var(--ink);font-size:14px;font-family:var(--display)}
.scrollhint{font-size:11.5px;color:var(--text-soft);text-align:right;margin:-6px 0 0}
.contact{
  text-align:center;font-size:12.5px;color:var(--text-soft);line-height:1.6;
  border-top:2px dashed var(--line);margin-top:14px;padding-top:14px
}
.contact a{color:var(--ink-2);font-weight:700;text-decoration:none}
.contact .ig{display:inline-flex;align-items:center;gap:5px}
.addon{
  display:flex;align-items:center;gap:12px;background:var(--surface);
  border:2px solid var(--line);border-radius:var(--r-m);padding:11px 14px;width:100%;text-align:left
}
.addon[aria-pressed="true"]{border-color:var(--ink);background:var(--cream-2)}
.addon .t{font-weight:700;font-size:15px}
.addon .d{font-size:12.5px;color:var(--text-soft)}
.addon .p{margin-left:auto;font-weight:900;color:var(--ink-2);white-space:nowrap}

/* ---------- forms ---------- */
.field{display:block;margin:12px 0}
.field > span{display:block;font-size:13px;font-weight:700;margin-bottom:5px;color:var(--text)}
.field > span em{font-style:normal;font-weight:600;color:var(--text-soft)}
input[type=text],input[type=tel],input[type=number],input[type=password],select,textarea{
  width:100%;background:var(--bone);border:2px solid var(--line);border-radius:var(--r-s);
  padding:10px 12px;color:var(--text)
}
input::placeholder,textarea::placeholder{color:var(--text-soft);opacity:.7}
textarea{min-height:68px;resize:vertical}
.radios{display:grid;gap:8px}
.radio{
  display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:2px solid var(--line);
  border-radius:var(--r-s);padding:11px 13px;width:100%;text-align:left
}
.radio[aria-pressed="true"]{border-color:var(--ink);background:var(--cream-2)}
.radio .mk{
  flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--line-strong);margin-top:2px;
  display:grid;place-items:center
}
.radio[aria-pressed="true"] .mk{border-color:var(--ink)}
.radio[aria-pressed="true"] .mk::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--ink)}
.radio .t{font-weight:700;font-size:14.5px;line-height:1.25}
.radio .d{font-size:12.5px;color:var(--text-soft)}
.radio .p{margin-left:auto;font-weight:800;font-size:13.5px;white-space:nowrap}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--ink);color:var(--pill-text);border-radius:999px;padding:13px 22px;
  font-family:var(--display);font-weight:700;font-size:17px;box-shadow:var(--shadow)
}
.btn.block{display:flex;width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line-strong);box-shadow:none}
.btn.gold{background:var(--marigold);color:#12351F}
.btn.sm{padding:8px 15px;font-size:14.5px}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.btn.danger{background:transparent;color:var(--bad);border:2px solid var(--bad);box-shadow:none}

/* ---------- sticky bar ---------- */
.sticky{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--surface);border-top:2px solid var(--line-strong);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));
}
.sticky .inner{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.sticky .sum{line-height:1.2}
.sticky .sum b{font-family:var(--display);font-size:19px;display:block;color:var(--ink)}
.sticky .sum span{font-size:11.5px;color:var(--text-soft)}
.sticky .btn{margin-left:auto;flex:none}

/* ---------- receipt / summary ---------- */
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-m);padding:16px}
.card + .card{margin-top:12px}
.rows{display:grid;gap:7px;font-size:14.5px}
.row{display:flex;gap:12px;justify-content:space-between;align-items:baseline}
.row span:last-child{font-weight:700;white-space:nowrap}
.row.total{border-top:2px dashed var(--line-strong);padding-top:9px;margin-top:3px;font-size:17px}
.row.total span{font-family:var(--display);font-weight:800}
.row.muted span{color:var(--text-soft);font-weight:600}
/* Payment ticket: colours are FIXED (not theme tokens) so it is equally readable
   in light and dark mode. White on deep green, amount in a bright box. */
.tix{
  text-align:center;background:#12351F;color:#FFFFFF;border:3px solid #F0A93C;
  border-radius:var(--r-m);padding:22px 16px
}
.tix .k{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#F0A93C}
.tix .code{font-family:var(--display);font-weight:800;font-size:44px;letter-spacing:.05em;line-height:1.05;color:#FFFFFF;margin-top:2px}
.tix .lbl{font-size:15px;font-weight:600;color:#FFFFFF;margin-top:4px}
.tix .amt{background:#FFFBF2;color:#12351F;border-radius:14px;padding:14px 12px;margin-top:18px}
.tix .amt .ak{font-size:14px;font-weight:800;color:#12351F}
.tix .amt .av{font-family:var(--display);font-weight:800;font-size:38px;line-height:1.1;color:#12351F;margin:2px 0 6px}
.tix .amt .an{font-size:14px;font-weight:600;color:#33483B;line-height:1.4}
.chip{
  display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;
  font-size:12px;font-weight:800
}
.chip.paid{background:rgba(29,122,76,.16);color:var(--good)}
.chip.pending{background:rgba(184,112,26,.16);color:var(--warn)}
.chip.cash{background:rgba(163,51,39,.14);color:var(--bad)}
.chip.neutral{background:var(--cream-2);color:var(--text-soft)}

.bowlline{font-size:13.5px;color:var(--text-soft);line-height:1.45}
.bowlline b{color:var(--text)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;background:var(--cream-2);padding:4px;border-radius:999px;margin:14px 0}
.tabs button{
  flex:1;padding:8px 6px;border-radius:999px;font-weight:800;font-size:13.5px;color:var(--text-soft)
}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* ---------- dashboard ---------- */
.dash-top{background:var(--ink);color:var(--pill-text);padding:18px 0 56px;margin-bottom:-44px}
.dash-top .wrap{padding-bottom:0}
.dash-top h2{font-family:var(--display);font-size:26px;margin:0;font-weight:800}
.dash-top p{margin:2px 0 0;font-size:13.5px;opacity:.78}
.hdr-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.hdr-actions .out{margin-left:0}
.dash-top .out{margin-left:auto;color:var(--pill-text);border:2px solid color-mix(in srgb,var(--pill-text) 45%,transparent);border-radius:999px;padding:6px 14px;font-weight:700;font-size:13.5px}
.dash-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

@media(max-width:620px){.dash-top .dash-head > div:first-child{padding-right:0;flex:1 1 100%}}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-m);padding:13px 14px}
.kpi .k{font-size:12px;font-weight:700;color:var(--text-soft)}
.kpi .v{font-family:var(--display);font-weight:800;font-size:25px;color:var(--ink);line-height:1.15;margin-top:2px}
.kpi .n{font-size:11.5px;color:var(--text-soft)}
.kpi.hero{background:var(--marigold);border-color:var(--marigold-dk)}
.kpi.hero .k,.kpi.hero .n{color:#3A2A08}
.kpi.hero .v{color:#12351F}

.chartwrap{margin-top:12px}
.bars{display:flex;align-items:flex-end;gap:3px;height:150px}
.bars .bar{flex:1;display:flex;flex-direction:column;height:100%;min-width:0}
.bars .col{flex:1;display:flex;align-items:flex-end;background:linear-gradient(var(--line),var(--line)) center/100% 1px no-repeat}
.bars .fill{width:100%;background:var(--ink-3);border-radius:3px 3px 0 0;min-height:2px}
.bars .fill.now{background:var(--marigold)}
.bars .lab{font-size:10px;font-weight:700;color:var(--text-soft);text-align:center;padding-top:5px;
  overflow:hidden;text-overflow:clip;white-space:nowrap}
@media(max-width:480px){.bars .bar:nth-child(even) .lab{visibility:hidden}}
.barscale{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;color:var(--text-soft);margin-top:6px}

table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:430px}
th{
  text-align:left;font-size:11.5px;color:var(--text-soft);font-weight:800;
  padding:0 8px 7px;border-bottom:2px solid var(--line)
}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;white-space:nowrap}
td b{font-weight:800}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

.note{
  background:var(--cream-2);border-left:4px solid var(--marigold);border-radius:0 var(--r-s) var(--r-s) 0;
  padding:11px 14px;font-size:13.5px;color:var(--text)
}
.note b{display:block;margin-bottom:2px}

/* ---------- banner preview ---------- */
.xb{
  background:var(--cream);border:2px solid var(--line-strong);border-radius:var(--r-m);
  padding:26px 20px;text-align:center;max-width:320px;margin:0 auto
}
.xb .k{font-family:var(--display);font-weight:800;font-size:27px;color:var(--ink);line-height:1.05;margin:10px 0 2px}
.xb .s{font-size:13px;color:var(--text-soft);margin-bottom:16px}
.xb .qr{background:#ffffff;border-radius:10px;padding:14px;display:inline-block;border:1px solid rgba(18,53,31,.25)}
.xb .qr svg{display:block;width:200px;height:200px;max-width:58vw}
.xb .v{margin-top:14px;font-weight:800;font-size:14px;color:var(--ink)}

<!-- Your Supabase connection lives in config.js, a separate file, so uploading a new
     index.html can never wipe it. If the file is missing the page says so on screen. -->

<script>
/* ============================================================
   Pawsly — venue QR ordering + partner revenue share
   ============================================================ */

const KEY = 'pawsly:v1';
const DEFAULT_RATE = 0.10;        // 10% to the venue
const MAX_BRANCHES = 5;           // HQ console stops offering "add branch" at this many
const IDLE_MS = 30*60*1000;       // staff sessions end after 30 min without a tap or key

/* ============================================================
   BRAND — edit these five lines to rebrand the whole app
   ============================================================ */
const BRAND = {
  name:    'Pawsly Gourmet',              // wordmark text, used when logo is empty
  tagline: "Your pet's personal chef",    // small caps line under the logo
  logo:    'Logo.png',                    // must match the uploaded filename EXACTLY, capitals included
  logoH:   190,                           // logo height in px (capped at 86vw so phones never clip it)
  qrisImage: 'qris.png',                  // your static QRIS sticker, sitting next to index.html
  // Must match what the customer's e-wallet shows when they scan, or they
  // hesitate. Taken from the QRIS sticker itself.
  payeeName:    'Pawsly Tangerang - Petshop',
  qrisMerchant: 'Pawsly Tangerang - Petshop',
  qrisNmid:     'ID2026523403767',
  promoTitle: 'Freshly cooked, right here at the park',
  promoLine:  'Pick a portion, mix the toppings, collect at the counter',
  bannerHeadline: 'Give The Very best for your Pet',   // the big line on the printed x-banner
  bannerSub: 'Pick, Mix, Delivered it to You',
  // Shown at the bottom of the menu and on every receipt.
  address:   'Ruko Pasar Sinpasa Blok SG 3 no.8, Gading Serpong, Tangerang',
  instagram: '@pawsly.id',
  whatsapp:  '0819 5918 8563',      // shown as written; the chat link is built from the digits

function logoMark(size, suffix){

  return (BRAND.logo
    ? `<img src="${esc(BRAND.logo)}" alt="${esc(BRAND.name)}" style="height:${size}px;width:auto;vertical-align:middle">`
    : `<span class="paws">\u{1F43E} \u{1F43E}</span>${esc(BRAND.name)}`) + tail;
}

/* ---------- catalogue ---------- */
const SIZES = [

    { id:'edamame',     label:'Edamame',     img:'edamame.jpg',     c1:'#8FBE4A', c2:'#5E8F2A', shape:'grain' },
    { id:'kembang_kol', label:'Cauliflower', img:'cauliflower.jpg', c1:'#EFE3C8', c2:'#D4C39C', shape:'floret' },
    { id:'zucchini',    label:'Zucchini',    img:'zucchini.jpg',    c1:'#8DB04A', c2:'#5C8130', shape:'dice' },
  ]},
  { id:'karbohidrat', title:'Carbs', max:2, items:[
    { id:'oats',       label:'Rolled Oats',  img:'oats.jpg',         c1:'#D9BE8A', c2:'#B99A61', shape:'grain' },
    { id:'labu',       label:'Pumpkin',      img:'pumpkin.jpg',      c1:'#E89A2A', c2:'#C47812', shape:'dice' },
    { id:'ubi_madu',   label:'Sweet Potato', img:'sweet-potato.jpg', c1:'#DD6B20', c2:'#B24D0D', shape:'dice' },
    { id:'ubi_ungu',   label:'Purple Yam',   img:'purple-yam.jpg',   c1:'#6B3FA0', c2:'#47266E', shape:'dice' },
  ]},
];

/* Add-ons come in sizes. Each product below is shown as ONE card with S/M/L
   buttons; a bowl can hold at most one size per product. The flat ADDONS list
   (id, label, price) is generated from it, so orders, receipts, CSV and the
   dashboards keep working exactly as before. */
const ADDON_GROUPS = [
  { id:'potion', label:'Pawsly Potion', desc:'Salmon oil and eggshell powder',
    sizes:[ {n:'Small',price:3000}, {n:'Medium',price:6000}, {n:'Large',price:9000} ] },
  { id:'vco',    label:'VCO Oil',       desc:'Virgin coconut oil',
    sizes:[ {n:'Small',price:2000}, {n:'Medium',price:4000}, {n:'Large',price:6000} ] },
];
const ADDONS = ADDON_GROUPS.flatMap(g => g.sizes.map(z => ({
  id: g.id+'_'+z.n.charAt(0).toLowerCase(), grp:g.id, size:z.n,
  label: g.label+' ('+z.n+')', price:z.price, desc:g.desc,
})));

/* Treats. price:null + soon:true = listed on the menu but cannot be ordered yet.
   Drop a photo next to index.html and set img to its exact filename -- until
   then a drawn placeholder (c1 / c2 / shape) is shown automatically. */
const SNACKS = [
  { id:'bully_s',   label:'Bully Stick (S)',  price:20000, desc:'1 pcs', img:'treat-bully-s.jpg',  c1:'#B07A4A', c2:'#7A4F2A', shape:'blob' },
  { id:'bully_m',   label:'Bully Stick (M)',  price:29000, desc:'1 pcs', img:'treat-bully-m.jpg',  c1:'#B07A4A', c2:'#7A4F2A', shape:'blob' },
  { id:'quail',     label:'Baby Quail',       price:12000, desc:'2 pcs', img:'treat-quail.jpg',    c1:'#C99A5B', c2:'#8E6A35', shape:'blob' },
  { id:'rab_ear',   label:'Rabbit Ear',       price:21000, desc:'2 pcs', img:'treat-rabbit-ear.jpg',  c1:'#D8C3A5', c2:'#A88F6B', shape:'blob' },
  { id:'rab_foot',  label:'Rabbit Foot',      price:21000, desc:'2 pcs', img:'treat-rabbit-foot.jpg', c1:'#D8C3A5', c2:'#A88F6B', shape:'blob' },
  { id:'fd_beef',   label:'Freeze Dry Beef',  price:null, soon:true, desc:'Details coming soon', img:'treat-fd-beef.jpg',    c1:'#C2342B', c2:'#8E201A', shape:'dice' },
  { id:'fd_chicken',label:'Freeze Dry Chicken',price:null, soon:true, desc:'Details coming soon', img:'treat-fd-chicken.jpg', c1:'#F0D6A8', c2:'#D8B26A', shape:'dice' },
  { id:'bones',  label:'Beef Flavoured Bones Biscuit', price:13000, desc:'Baked biscuit',        img:'treat-bones.jpg',  c1:'#C2342B', c2:'#8E201A', shape:'dice' },
  { id:'banana', label:'Banana Biscuits',              price:10000, desc:'Fruity biscuit, 100g', img:'treat-banana.jpg', c1:'#E8C86A', c2:'#B99A61', shape:'dice' },
  { id:'cube',   label:'Silky Beef Cube',              price:12000, desc:'Soft beef treat',      img:'treat-cube.jpg',   c1:'#8E4A3A', c2:'#5A2A1E', shape:'dice' },
];

const RECIPES = [
  { id:'tears', n:1, title:'Bye Bye Tears Stain', desc:'Chicken · Chicken Liver · Rolled Oats · Carrot',
    pick:{ protein:['ayam'], organ:['liver_ayam'], sayuran:['wortel'], karbohidrat:['oats'] }, addons:[] },
  { id:'bulu', n:2, title:'Bye Bye Bulu Rontok', desc:'Beef · Beef Liver · Sweet Potato · Carrot + Pawsly Potion (S)',
    pick:{ protein:['sapi'], organ:['liver_sapi'], sayuran:['wortel'], karbohidrat:['ubi_madu'] }, addons:['potion_s'] },
];

/* All payment methods that exist. Which ones a branch OFFERS is set below. */
//   collect : 'pawsly' = you receive the money and owe the venue its share
//             'venue'  = the branch's own cashier receives it
//   uniq    : add a 2-digit verification code to the amount so staff can match a
//             payment to an order (QR only; cashier orders need none)
//   showQr  : display BRAND.qrisImage on the order-confirmed screen
const PAYMENTS = [
  { id:'qris', label:'Scan QR',        desc:'Scan with any e-wallet or mobile banking app', collect:'pawsly', uniq:true,  showQr:true  },
  { id:'cash', label:'Pay at cashier', desc:'Pay at the counter when you collect',          collect:'venue',  uniq:false, showQr:false },
];

/* Per-branch rules. The key is the branch CODE (upper case) or the branch NAME
   (lower case) -- either works.
     pay    : which payment methods the branch offers (ids from PAYMENTS)
     treats : whether the Treats menu is shown at this branch
   A branch that is not listed gets DEFAULT_RULE, so a new branch can never
   accidentally offer QR payment or the treats menu. */
const BRANCH_RULES = {
  'pawsly hq': { pay:['qris','cash'], treats:true  },   // Scan QR + Pay at cashier, with treats
  'paws':      { pay:['cash'],        treats:false },   // Pay at cashier only, bowls only
};
const DEFAULT_RULE = { pay:['cash'], treats:false };
function branchRule(v){
  if(!v) return DEFAULT_RULE;
  return BRANCH_RULES[String(v.code||'').toUpperCase()] || BRANCH_RULES[String(v.name||'').trim().toLowerCase()] || DEFAULT_RULE;
}
function allowedPayments(v){
  const ids = branchRule(v).pay;
  const out = PAYMENTS.filter(m=>ids.includes(m.id));
  return out.length ? out : PAYMENTS.filter(m=>m.id==='cash');
}
const treatsOn = v => !!branchRule(v).treats;
/* The method actually in force: the customer's pick if this branch allows it,
   otherwise the branch's first method. */
function curPay(){
  const al = allowedPayments(venue(S.venueCode));
  return al.find(m=>m.id===S.payment) || al[0];
}

const FULFIL = [
  { id:'counter',  label:'Pick up at the counter', desc:"We'll deliver it to you when it's ready" },
];

/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp  = n => 'Rp ' + Math.round(n||0).toLocaleString('en-US');
const rpk = n => n>=1e6 ? 'Rp ' + (n/1e6).toFixed(n>=1e7?0:1) + 'M'
                : n>=1e3 ? 'Rp ' + Math.round(n/1e3) + 'k' : rp(n);
const dayKey = d => { const x=new Date(d); const p=n=>String(n).padStart(2,'0');
                      return `${x.getFullYear()}-${p(x.getMonth()+1)}-${p(x.getDate())}`; };
const todayKey = () => dayKey(new Date());
const fmtDay = k => new Date(k+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const fmtTime = iso => new Date(iso).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const rid = n => Array.from({length:n},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');
const itemById = id => GROUPS.flatMap(g=>g.items).find(i=>i.id===id) || ADDONS.find(a=>a.id===id);
const label = id => (itemById(id)||{label:id}).label;

function medallion(it){
  const dots = {
    dice:   [[30,34,22],[66,44,20],[46,70,19]],
    blob:   [[36,40,27],[66,58,23],[44,74,16]],
    floret: [[32,36,18],[58,30,16],[70,56,19],[40,66,18],[56,72,14]],
    grain:  [[28,38,13],[50,30,12],[68,44,13],[38,58,12],[60,64,13],[44,74,11]],
  }[it.shape] || [[50,50,28]];
  const layers = dots.map((d,i)=>`radial-gradient(circle at ${d[0]}% ${d[1]}%, ${i%2?it.c2:it.c1} 0 ${d[2]}%, transparent ${d[2]+1}%)`);
  const drawn = layers.join(',') + `, color-mix(in srgb, ${it.c1} 18%, transparent)`;
  // Photo first, drawn version underneath. If the file 404s the browser just
  // skips that layer and the drawn ingredient shows instead of an empty circle.
  // Single quotes are required: this sits inside style="..." .
  return it.img ? `url('${String(it.img).replace(/['"\\]/g,'')}') center/cover no-repeat, ${drawn}` : drawn;
}

/* ---------- state ---------- */
let DB = null;          // { venues, orders, config }
let S = {               // view state
  route:'order', venueCode:null, stage:'menu',
  size:null, pick:{protein:[],organ:[],sayuran:[],karbohidrat:[]}, addons:[],   // size null = treats only
  snacks:{},                       // { snackId: qty }
  bowls:[],                        // basket: finished bowls [{size,pick,addons}]
  fulfil:FULFIL[0].id, payment:PAYMENTS[0].id, uniq:null, rep:{ venue:'all', days:'30' }, pw:false,
  cust:{name:'',phone:'',dog:''}, note:'',
  lastOrder:null, session:null, hq:false, tab:'today', editVenue:null, closedVenue:null, askedFor:'',
};

/* ---------- storage + auth ----------------------------------------
   Customers never read the orders table. They only call place_order(),
   a SECURITY DEFINER function, so no customer's name, phone or order
   history is reachable with the public anon key.

   Dashboards require a real Supabase Auth sign-in. What a signed-in
   person can see comes from their row in `staff`:
     role 'hq'    -> every venue
     role 'venue' -> only their own venue_code
   Enforced by RLS in the database, not by this file.
-------------------------------------------------------------------- */

/* ============================================================
   DATABASE — fill these two in and commit. Customers scanning a QR
   have never configured anything on their phone, so the connection
   has to ship inside the page.

   The publishable key is MEANT to be public: it carries no privileges
   of its own, and Row Level Security in supabase-setup.sql is what
   actually protects the data. Never put the secret key here.
   ============================================================ */
/* The connection now comes from config.js (next to index.html), so this file
   never needs editing and a new upload can never blank it. Anything already
   typed here still works as a fallback. */
function keyIsSecret(k){
  k = String(k||'');
  if(/^sb_secret_/.test(k)) return true;
  if(/^eyJ/.test(k)){                       // legacy JWT keys: read the role claim
    try{
      const body = JSON.parse(atob(k.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
      return body.role === 'service_role';
    }catch(e){ return false; }
  }
  return false;
}
const SUPABASE = Object.assign({ url:'', key:'' }, (window.PAWSLY_CONFIG || {}));
SUPABASE.url = String(SUPABASE.url||'').trim().replace(/\/+$/,'');
SUPABASE.key = String(SUPABASE.key||'').trim();
// config.js is public. A secret key there would hand out the whole database,
// so it is refused outright and flagged loudly on screen.
const SECRET_IN_CONFIG = keyIsSecret(SUPABASE.key);
if(SECRET_IN_CONFIG){ console.error('config.js contains a SECRET key. Remove it and rotate it in Supabase.'); SUPABASE.key = ''; }

/* Staff sign in with a USERNAME. Supabase Auth needs an email-shaped id, so the
   username is quietly turned into username@staff.pawsly.id. That address never
   receives mail; the admin creates the account and sets the temporary password.
   Anyone who already has a real email can still type the full email. */
const STAFF_DOMAIN = 'staff.pawsly.id';
const loginEmail = u => { u = String(u||'').trim().toLowerCase().replace(/\s+/g,''); return u.includes('@') ? u : u+'@'+STAFF_DOMAIN; };
const uname = e => { e = String(e||''); const x='@'+STAFF_DOMAIN; return e.endsWith(x) ? e.slice(0,-x.length) : e; };
const ROLE_LABEL = { hq:'Admin', venue:'Branch', staff:'Staff' };

const CONN = 'pawsly:conn';
const CFGK = 'pawsly:cfg';
const SESS = 'pawsly:sess';
const ORDER_COLS = 'id,code,venue_code,created_at,size,size_name,pick,addons,snacks,fulfil,fee,'
                 + 'payment,payment_label,collect,status,cust_name,dog_name,phone_mask,note,'
                 + 'subtotal,total,uniq,pay_total,rate,commission,settled,notified';

const maskPhone = p => { const d=String(p||'').replace(/\D/g,''); return d.length>3 ? '\u2022\u2022\u2022\u2022'+d.slice(-4) : ''; };

const toRowVenue = v => ({ code:v.code, name:v.name, kind:v.kind, city:v.city, rate:v.rate, payout:v.payout, active:v.active!==false });
const fromRowVenue = r => ({ code:r.code, name:r.name, kind:r.kind||'', city:r.city||'', rate:Number(r.rate)||0, payout:r.payout||'Not set', active:r.active!==false });

const orderPayload = o => ({
  code:o.code, venue_code:o.venueCode, size:o.size, size_name:o.sizeName,
  pick:o.pick, addons:o.addons, snacks:o.snacks||[], fulfil:o.fulfil, fee:o.fee,
  payment:o.payment, payment_label:o.paymentLabel, collect:o.collect, status:o.status,
  cust_name:o.cust.name, dog_name:o.cust.dog,
  phone:o.cust.phone||'', phone_mask:maskPhone(o.cust.phone),
  note:o.note||'', subtotal:o.subtotal, total:o.total, rate:o.rate, commission:o.commission,
});
const fromRowOrder = r => ({
  id:r.id, code:r.code, venueCode:r.venue_code, createdAt:r.created_at,
  size:r.size, sizeName:r.size_name, pick:r.pick||{}, addons:r.addons||[], snacks:r.snacks||[],
  fulfil:r.fulfil, fee:r.fee||0, payment:r.payment, paymentLabel:r.payment_label,
  collect:r.collect, status:r.status,
  cust:{ name:r.cust_name||'', dog:r.dog_name||'', phone:r.phone_mask||'' },
  note:r.note||'', subtotal:r.subtotal||0, total:r.total||0,
  uniq:r.uniq||0, payTotal:r.pay_total||r.total||0,
  rate:Number(r.rate)||0, commission:r.commission||0, settled:!!r.settled, notified:!!r.notified,
});

const STORE = {
  mode:'memory', canLocal:false, cfg:{url:'',key:''}, session:null,

  boot(){
    try{
      localStorage.setItem('pawsly:probe','1'); localStorage.removeItem('pawsly:probe');
      this.canLocal = true;
      const c = JSON.parse(localStorage.getItem(CONN)||'null');
      if(c && c.url && c.key) this.cfg = c;                       // per-device override
      else if(SUPABASE.url && SUPABASE.key) this.cfg = {...SUPABASE};
      const s = JSON.parse(localStorage.getItem(SESS)||'null');
      if(s && s.token){
        const act = Number(localStorage.getItem('pawsly:act')||0);
        if(act && Date.now()-act > IDLE_MS) localStorage.removeItem(SESS);   // stale: make them sign in again
        else this.session = s;
      }
    }catch(e){
      this.canLocal = false;
      if(SUPABASE.url && SUPABASE.key) this.cfg = {...SUPABASE};   // storage blocked, still works
    }
    this.mode = (this.cfg.url && this.cfg.key) ? 'cloud' : (this.canLocal ? 'device' : 'memory');
    if(this.mode !== 'cloud') this.session = null;
  },
  get live(){ return this.mode==='cloud'; },
  get signedIn(){ return !!(this.session && this.session.role); },
  get isHQ(){ return this.signedIn && this.session.role==='hq'; },
  get isStaff(){ return this.signedIn && this.session.role==='staff'; },
  label(){ return { cloud:'Supabase \u2014 live', device:'This device only', memory:'Temporary \u2014 not saved' }[this.mode]; },

  saveSession(){ try{ this.session ? localStorage.setItem(SESS, JSON.stringify(this.session)) : localStorage.removeItem(SESS); }catch(e){} },

  /* ---- auth ---- */
  async signIn(login, password){
    const email = loginEmail(login);
    const r = await fetch(this.cfg.url.replace(/\/+$/,'') + '/auth/v1/token?grant_type=password', {
      method:'POST', headers:{ apikey:this.cfg.key, 'Content-Type':'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const d = await r.json().catch(()=>({}));
    if(!r.ok){
      if(/invalid login/i.test(d.error_description||d.msg||d.message||'')) throw new Error('Wrong username or password');
      throw new Error(d.error_description || d.msg || d.message || ('sign-in failed ('+r.status+')'));
    }
    this.session = { token:d.access_token, refresh:d.refresh_token, email:(d.user||{}).email };
    let rows;
    try{ rows = await this.api('staff?select=role,venue_code&limit=1', this.read); }
    catch(e){ this.session=null; throw new Error('Signed in, but access could not be loaded. Ask Pawsly admin.'); }
    if(!rows || !rows.length){ this.session=null; throw new Error('This login has no access set up yet. Ask Pawsly admin.'); }
    this.session.role = rows[0].role;
    this.session.venueCode = rows[0].venue_code;
    this.saveSession();
  },
  async refresh(){
    if(!this.session || !this.session.refresh) return false;
    try{
      const r = await fetch(this.cfg.url.replace(/\/+$/,'') + '/auth/v1/token?grant_type=refresh_token', {
        method:'POST', headers:{ apikey:this.cfg.key, 'Content-Type':'application/json' },
        body: JSON.stringify({ refresh_token:this.session.refresh }),
      });
      if(!r.ok) return false;
      const d = await r.json();
      this.session.token = d.access_token; this.session.refresh = d.refresh_token;
      this.saveSession();
      return true;
    }catch(e){ return false; }
  },
  signOut(){ this.session = null; this.saveSession(); },
  async changePassword(current, next){
    const base = this.cfg.url.replace(/\/+$/,'');
    const v = await fetch(base + '/auth/v1/token?grant_type=password', {
      method:'POST', headers:{ apikey:this.cfg.key, 'Content-Type':'application/json' },
      body: JSON.stringify({ email:this.session.email, password:current }),
    });
    if(!v.ok) throw new Error('Current password is wrong');
    const d = await v.json();
    this.session.token = d.access_token; this.session.refresh = d.refresh_token;
    const r = await fetch(base + '/auth/v1/user', {
      method:'PUT',
      headers:{ apikey:this.cfg.key, 'Content-Type':'application/json', Authorization:'Bearer '+this.session.token },
      body: JSON.stringify({ password:next }),
    });
    if(!r.ok){ const e = await r.json().catch(()=>({})); throw new Error(e.msg || e.message || e.error_description || ('Could not change password ('+r.status+')')); }
    this.saveSession();
  },

  /* ---- rest ---- */
  async api(path, opts={}, retry=true){
    // The project key always travels on `apikey`. Authorization carries the
    // signed-in user's JWT and NOTHING else -- a publishable key put there
    // gets parsed as a JWT and rejected with "Invalid JWT".
    const head = { apikey:this.cfg.key, 'Content-Type':'application/json', Prefer:'return=minimal' };
    if(this.session && this.session.token) head.Authorization = 'Bearer ' + this.session.token;
    const r = await fetch(this.cfg.url.replace(/\/+$/,'') + '/rest/v1/' + path, Object.assign({}, opts, {
      headers: Object.assign(head, opts.headers||{}),
    }));
    if(r.status===401 && retry && this.session){
      if(await this.refresh()) return this.api(path, opts, false);
      this.signOut();
      throw new Error('session expired, please sign in again');
    }
    if(!r.ok) throw new Error(r.status + ' ' + (await r.text()).slice(0,140));
    return r.status===204 ? null : r.json();
  },
  get read(){ return { headers:{ Prefer:'return=representation' } }; },

  localCfg(){
    let c={}; try{ c = JSON.parse(localStorage.getItem(CFGK)||'{}'); }catch(e){}
    return Object.assign({ rate:DEFAULT_RATE, notifyUrl:'', baseUrl: location.href.split('#')[0].split('?')[0] }, c);
  },
  saveCfg(){ try{ localStorage.setItem(CFGK, JSON.stringify({ baseUrl:DB.config.baseUrl, notifyUrl:DB.config.notifyUrl })); }catch(e){} },

  /* ---- reads ---- */
  async loadAll(){
    if(this.mode==='cloud'){
      const venues = (await this.api('venues?select=*&order=name.asc', this.read)).map(fromRowVenue);
      // Orders are only readable with a staff session; customers never fetch them.
      let orders = [];
      if(this.signedIn){
        orders = (await this.api('orders?select='+ORDER_COLS+'&order=created_at.asc&limit=5000', this.read)).map(fromRowOrder);
      }
      return { venues, orders };
    }
    if(this.mode==='device'){
      try{ const raw = localStorage.getItem(KEY); if(raw) return JSON.parse(raw); }catch(e){}
    }
    return null;
  },

  async persist(){
    if(this.mode!=='device') return;
    try{ localStorage.setItem(KEY, JSON.stringify({ venues:DB.venues, orders:DB.orders.slice(-800) })); }
    catch(e){ toast('Device storage is full'); }
  },

  /* ---- writes ---- */
  async addOrder(o){
    if(this.mode!=='cloud'){
      o.uniq = o.uniq || 0; o.payTotal = o.total + o.uniq;
      DB.orders.push(o); return this.persist();
    }
    // The database assigns the verification code inside one transaction, so two
    // phones ordering at the same second can never be quoted the same amount.
    const res = await this.api('rpc/place_order', {
      method:'POST', headers:{ Prefer:'return=representation' },
      body: JSON.stringify({ p: orderPayload(o) }),
    });
    const d = Array.isArray(res) ? res[0] : res;
    if(d){ o.id = d.id || o.id; o.uniq = d.uniq || 0; o.payTotal = d.pay_total || o.total; }
    DB.orders.push(o);
  },

  async saveVenue(v){
    if(this.mode!=='cloud') return this.persist();
    try{ await this.api('venues?on_conflict=code', { method:'POST', headers:{ Prefer:'resolution=merge-duplicates' }, body:JSON.stringify(toRowVenue(v)) }); }
    catch(e){ toast('Could not save venue: '+e.message); }
  },
  async settle(code){
    ordersFor(code).forEach(o=>o.settled=true);
    if(this.mode!=='cloud') return this.persist();
    try{ await this.api('orders?venue_code=eq.'+encodeURIComponent(code), { method:'PATCH', body:JSON.stringify({ settled:true }) }); }
    catch(e){ toast('Server update failed: '+e.message); }
  },
  async settleOrder(id){
    const o = DB.orders.find(x=>x.id===id); if(!o) return;
    o.settled = true;
    if(this.mode!=='cloud') return this.persist();
    try{ await this.api('orders?id=eq.'+encodeURIComponent(id), { method:'PATCH', body:JSON.stringify({ settled:true }) }); }
    catch(e){ toast('Server update failed: '+e.message); }
  },
  async deleteVenue(code){
    DB.venues = DB.venues.filter(v=>v.code!==code);
    if(this.mode!=='cloud') return this.persist();
    try{ await this.api('venues?code=eq.'+encodeURIComponent(code), { method:'DELETE' }); }
    catch(e){ toast('Server delete failed: '+e.message); }
  },
};

/* ---------- derived ---------- */
const venue = code => {
  const k = String(code||'').trim().toUpperCase();
  return DB.venues.find(v=>String(v.code).toUpperCase()===k);
};
const ordersFor = code => DB.orders.filter(o=>o.venueCode===code);
function totals(list){
  const gmv = list.reduce((s,o)=>s+o.total,0);
  const com = list.reduce((s,o)=>s+o.commission,0);
  const cash = list.filter(o=>o.collect==='venue');
  const cashHeld = cash.reduce((s,o)=>s+o.total,0);
  const cashCom = cash.reduce((s,o)=>s+o.commission,0);
  return { n:list.length, gmv, com, cashHeld, owedToPawsly: cashHeld-cashCom, avg: list.length? gmv/list.length : 0 };
}
function byDay(list, days=14){
  const out = [];
  for(let d=days-1; d>=0; d--){
    const dt = new Date(); dt.setDate(dt.getDate()-d);
    const k = dayKey(dt);
    const rows = list.filter(o=>dayKey(o.createdAt)===k);
    out.push({ k, ...totals(rows) });
  }
  return out;
}

/* Drawn by hand rather than with createSvgTag, because three things decide
   whether a phone can actually read this:
     - a 4-module quiet zone. The spec requires it; scanners use that clear
       border to find the code. The old margin:1 is why nothing would scan.
     - pure #000 on pure #fff. Cream at #FFFBF2 cuts contrast for no reason.
     - shape-rendering=crispEdges, so modules don't get antialiased into grey
       fringes when the viewBox scales to a fractional pixel size. */
function qrSvg(text, px=200){
  if(typeof qrcode !== 'function')
    return `<div style="width:${px}px;height:${px}px;display:grid;place-items:center;font-size:11px;padding:8px;text-align:center">QR did not load.<br>Use the link below.</div>`;
  try{
    const q = qrcode(0,'M');
    q.addData(text);
    q.make();
    const n = q.getModuleCount(), quiet = 4, box = n + quiet*2;
    let d = '';
    for(let row=0; row<n; row++)
      for(let col=0; col<n; col++)
        if(q.isDark(row,col)) d += `M${col+quiet} ${row+quiet}h1v1h-1z`;
    return `<svg viewBox="0 0 ${box} ${box}" width="${px}" height="${px}" `
         + `shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="QR code">`
         + `<rect width="${box}" height="${box}" fill="#ffffff"/>`
         + `<path d="${d}" fill="#000000"/></svg>`;
  }catch(e){ return '<div style="padding:12px;font-size:11px">Link is too long for a QR code.</div>'; }
}
function orderLink(code){
  const base = (DB.config.baseUrl||'').replace(/[?#].*$/,'');
  return base + '?v=' + encodeURIComponent(code);
}

  const bowls = allBowls().map(b=>({ ...b, sz:SIZES.find(s=>s.id===b.size), price:bowlPrice(b) }));
  const bowlTotal = bowls.reduce((t,b)=>t+b.price,0);
  const size = bowls.length ? bowls[0].sz : null;                 // null = no bowl
  const snacks = snackLines(treatsOn(venue(S.venueCode)) ? S.snacks : {});
  const snackTotal = snacks.reduce((t,s)=>t+s.price*s.qty,0);
  const fee = (FULFIL.find(f=>f.id===S.fulfil)||{}).fee||0;

  return { size, bowls, bowlTotal, snacks, snackTotal, fee, subtotal, total, pay, uniq, payTotal: total + uniq };

/* Bowls of a saved order. Extra bowls ride inside pick.extra so the database
   table needs no new column; old single-bowl orders read exactly as before. */
function orderBowls(o){
  if(!o.size) return [];
  const extra = (o.pick && o.pick.extra) || [];
  const snackSum = (o.snacks||[]).reduce((t,s)=>t+s.price*s.qty,0);
  const extraSum = extra.reduce((t,b)=>t+(b.price||0),0);
  return [{ sizeName:o.sizeName, pick:o.pick, addons:o.addons, price:o.subtotal-snackSum-extraSum },
          ...extra.map(b=>({ sizeName:b.sizeName, pick:b.pick, addons:b.addons||[], price:b.price||0 }))];
}

/* A 2-digit code appended to the amount so a bank or QRIS entry maps to exactly
   one order: Rp 115,000 becomes Rp 115,012. Only codes already attached to an
   unsettled order are off-limits, so numbers are recycled once reconciled.
   The code is NOT revenue -- commission is still taken on the food subtotal. */
function pickUniq(){
  const used = new Set(DB.orders.filter(o=>!o.settled && o.uniq).map(o=>o.uniq));
  const free = [];
  for(let i=1;i<=99;i++) if(!used.has(i)) free.push(i);
  return free.length ? free[Math.floor(Math.random()*free.length)]
                     : 1 + Math.floor(Math.random()*99);
}

}

// 0819... or +62819... or 62819...  ->  62819...   (what wa.me expects)
function waDigits(n){
  let d = String(n||'').replace(/\D/g,'');
  if(d.startsWith('0')) d = '62' + d.slice(1);
  else if(d && !d.startsWith('62')) d = '62' + d;
  return d;
}

const bowlAddons = b => b.addons.map(id=>{const a=ADDONS.find(x=>x.id===id);return {id:a.id,label:a.label,price:a.price};});
/* First bowl fills the usual columns; any further bowls ride in pick.extra. */
function orderPick(bowls){
  if(!bowls.length) return EMPTY_PICK();
  const pick = JSON.parse(JSON.stringify(bowls[0].pick));
  if(bowls.length>1) pick.extra = bowls.slice(1).map(b=>({
    size:b.size, sizeName:b.sz.name, price:b.price,
    pick:JSON.parse(JSON.stringify(b.pick)), addons:bowlAddons(b),
  }));
  return pick;
}
async function placeOrder(){
  const name = ($('#cName')||{}).value?.trim() || '';
  const phone = ($('#cPhone')||{}).value?.trim() || '';
  if(!name || phone.replace(/\D/g,'').length < 9){
    toast('Enter your name and a valid WhatsApp number');
    const bad = !name ? $('#cName') : $('#cPhone'); if(bad) bad.focus();
    return;
  }
  S.cust = { name, phone, dog: ($('#cDog')||{}).value?.trim()||'' };
  S.note = ($('#cNote')||{}).value?.trim()||'';

  const p = priceNow();
  const v = venue(S.venueCode);
  const rate = v ? v.rate : 0;
  const pay = curPay();
  const btn = $('#payNow'); if(btn){ btn.disabled = true; btn.textContent = 'Processing…'; }

  const order = {
    id:'o'+Date.now(), code:'PW-'+rid(4),
    venueCode: S.venueCode || null,
    createdAt: new Date().toISOString(),
    size: p.bowls.length ? p.bowls[0].size : null,
    sizeName: p.size ? p.size.name : 'Treats only',
    pick: orderPick(p.bowls),
    addons: p.bowls.length ? bowlAddons(p.bowls[0]) : [],
    snacks: p.snacks,
    fulfil:S.fulfil, fee:p.fee,
    payment:pay.id, paymentLabel:pay.label, collect:pay.collect,
    status: pay.collect==='venue' ? 'awaiting_cash' : 'preparing',
    cust:{...S.cust}, note:S.note,
    subtotal:p.subtotal, total:p.total, uniq:p.uniq, payTotal:p.payTotal,
    rate, commission: Math.round(p.subtotal*rate),
    settled:false,
  };
  await STORE.addOrder(order);
  if(!pay.uniq){ order.uniq = 0; order.payTotal = order.total; }   // cashier orders carry no verification code
  notify(order);
  S.lastOrder = order; S.stage = 'done';
  render();
  window.scrollTo(0,0);
}

}

/* ============================================================

function repOrders(){
  const r = S.rep, now = new Date();
  let cut = 0;
  if(r.days==='today') cut = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  else if(r.days!=='all') cut = Date.now() - Number(r.days)*864e5;
  return DB.orders.filter(o => (r.venue==='all' || o.venueCode===r.venue) && new Date(o.createdAt).getTime() >= cut);
}

    <div class="step"><b>Sales report</b><i>${list.length} orders</i></div>

/* ============================================================
   CSV
   ============================================================ */
function downloadCsv(list, name){
  const head = ['code','time','venue','size','protein','organ','vegetables','carbs','addons','snacks','extra_bowls','payment','revenue','pay_amount','share_pct','venue_share','settlement'];
  const body = list.map(o=>[
    o.code, new Date(o.createdAt).toLocaleString('en-GB'), o.venueCode||'-', o.sizeName,
    (o.pick.protein||[]).map(label).join('|'), (o.pick.organ||[]).map(label).join('|'),
    (o.pick.sayuran||[]).map(label).join('|'), (o.pick.karbohidrat||[]).map(label).join('|'),
    o.addons.map(a=>a.label).join('|'),
    (o.snacks||[]).map(s=>s.label+' x'+s.qty).join('|'),
    orderBowls(o).slice(1).map(b=>b.sizeName+': '+GROUPS.map(g=>(b.pick[g.id]||[]).map(label).join('+')).join(' / ')+(b.addons.length?' + '+b.addons.map(a=>a.label).join('+'):'')).join(' | '),
    o.paymentLabel, o.total, o.payTotal||o.total, Math.round(o.rate*100), o.commission,
    o.settled?'settled':'pending',
  ].map(c=>{ c = String(c); if(/^[=+@]|^-./.test(c)) c = "'"+c;   // stop spreadsheet formula injection
             return `"${c.replace(/"/g,'""')}"`; }).join(','));
  const blob = new Blob(['\uFEFF'+[head.join(','),...body].join('\n')],{type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  toast('CSV downloaded');
}

/* ============================================================
   Router + events
   ============================================================ */
function render(){
  const app = $('#app'), st = $('#sticky');
  let html='', sticky='';
  if(S.route==='partner' || S.route==='hq'){
    if(!STORE.live)            html = viewConnect();
    else if(!STORE.signedIn)   html = viewSignIn();
    else if(STORE.isHQ)        html = viewHQ();          // Pawsly staff: every branch
    else if(STORE.isStaff)     html = viewStaff();       // branch staff: today's orders only
    else if(S.session)         html = viewPartner();     // branch manager: their branch
    else                       html = viewSignIn();
  }else{
    if(!S.venueCode) html = viewNoVenue();
    else if(S.stage==='menu'){ html = viewMenu(); sticky = stickyMenu(); }
    else if(S.stage==='checkout'){ html = viewCheckout(); sticky = stickyCheckout(); }
    else html = viewDone();
  }
  app.innerHTML = html;
  st.innerHTML = sticky;
}

/* If someone empties the basket while on the payment screen, send them back to the menu. */
function emptyCheckoutToMenu(){
  if(S.stage==='checkout' && !S.bowls.length && !S.size && !Object.values(S.snacks).some(q=>q>0)){
    S.stage='menu'; window.scrollTo(0,0);
  }
}

document.addEventListener('click', async (e)=>{
  const b = e.target.closest('button'); if(!b) return;
  const d = b.dataset;

  if(d.route){ S.route = d.route; if(d.route==='order') S.stage = S.lastOrder&&S.stage==='done'?'done':'menu'; render(); window.scrollTo(0,0); return; }
  if(d.venue){ S.venueCode = d.venue; S.stage='menu'; S.snacks = {}; S.payment = allowedPayments(venue(d.venue))[0].id; render(); return; }
  if(d.size){
    S.size = (S.size === d.size) ? null : d.size;     // tap again to drop the bowl
    if(!S.size){ S.addons = []; S.pick = {protein:[],organ:[],sayuran:[],karbohidrat:[]}; }
    render(); return;
  }
  if(d.recipe){
    const r = RECIPES.find(x=>x.id===d.recipe);
    S.pick = JSON.parse(JSON.stringify(r.pick)); S.addons = [...r.addons];
    render(); toast(r.title + ' selected'); return;
  }
  if(d.g){
    const g = GROUPS.find(x=>x.id===d.g);
    const sel = S.pick[d.g];
    const i = sel.indexOf(d.i);
    if(i>=0) sel.splice(i,1);
    else if(sel.length<g.max) sel.push(d.i);
    else { toast(`Maximum ${g.max} ${g.title.toLowerCase()}`); return; }
    render(); return;
  }
  if(d.snack){
    const n = Math.max(0, Math.min(20, (S.snacks[d.snack]||0) + parseInt(d.d,10)));
    if(n) S.snacks[d.snack] = n; else delete S.snacks[d.snack];
    emptyCheckoutToMenu(); render(); return;
  }
  if(d.rmbowl){
    S.bowls.splice(parseInt(d.rmbowl,10),1);
    emptyCheckoutToMenu(); render(); toast('Bowl removed'); return;
  }
  if(d.editbowl){
    if(S.size && !commitBowl()){ toast('Finish or clear the bowl you are building first'); return; }
    const b = S.bowls.splice(parseInt(d.editbowl,10),1)[0];
    S.size=b.size; S.pick=b.pick; S.addons=b.addons;
    keepForm(); S.stage='menu'; render(); window.scrollTo(0,0); return;
  }
  if(d.addon){
    // One size per product: picking a size replaces the other sizes of the same
    // product, and tapping the chosen size again removes it.
    const a = ADDONS.find(x=>x.id===d.addon); if(!a) return;
    const had = S.addons.includes(a.id);
    S.addons = S.addons.filter(id => (ADDONS.find(x=>x.id===id)||{}).grp !== a.grp);
    if(!had) S.addons.push(a.id);
    render(); return;
  }
  if(d.ful){ S.fulfil = d.ful; keepForm(); render(); return; }
  if(d.pay){ if(allowedPayments(venue(S.venueCode)).some(m=>m.id===d.pay)) S.payment = d.pay; keepForm(); render(); return; }
  if(d.tab){ S.tab = d.tab; render(); return; }
  if(d.edit){ S.editVenue = (S.editVenue===d.edit ? null : d.edit); render(); return; }
  if(d.print){ printBanner(d.print); return; }
  if(d.paid){ await STORE.settleOrder(d.paid); render(); toast('Marked received'); return; }

  switch(b.id){
    case 'addBowl':    if(commitBowl()){ render(); window.scrollTo(0,0); toast('Bowl added to your basket'); } break;
    case 'toCheckout': commitBowl(); S.payment = curPay().id; S.uniq = STORE.live ? 0 : pickUniq(); S.stage='checkout'; render(); window.scrollTo(0,0); break;
    case 'backMenu':   keepForm(); S.stage='menu'; render(); window.scrollTo(0,0); break;
    case 'payNow':     await placeOrder(); break;
    case 'again':
      S.pick={protein:[],organ:[],sayuran:[],karbohidrat:[]}; S.addons=[]; S.snacks={}; S.bowls=[]; S.stage='menu'; S.lastOrder=null;
      S.payment=allowedPayments(venue(S.venueCode))[0].id; S.fulfil=FULFIL[0].id; S.uniq=null;
      render(); window.scrollTo(0,0); break;
    case 'doSignIn': {
      const email = $('#aEmail').value.trim(), pass = $('#aPass').value;
      if(!email || !pass){ toast('Enter your username and password'); break; }
      const btn = $('#doSignIn'); btn.disabled = true; btn.textContent = 'Signing in\u2026';
      try{
        await STORE.signIn(email, pass); touch();
        S.session = STORE.session.venueCode || null;
        S.route = STORE.isHQ ? 'hq' : 'partner';
        S.tab = 'today';
        await load();
        toast('Signed in: ' + uname(STORE.session.email) + ' (' + (ROLE_LABEL[STORE.session.role]||'') + ')');
        render(); poll(); window.scrollTo(0,0);
      }catch(e){
        toast(e.message);
        btn.disabled = false; btn.textContent = 'Sign in';
      }
      break;
    }
    case 'sbForget': {
      try{ localStorage.removeItem(CONN); }catch(e){}
      STORE.signOut(); STORE.cfg={url:'',key:''}; STORE.boot();
      await load(); render(); toast('Database details cleared');
      break;
    }
    case 'logout':
      S.pw=false; STORE.signOut(); S.session=null; clearInterval(pollT);
      await load(); render(); toast('Signed out'); break;
    case 'copyLink': {
      const link = orderLink(S.session);
      try{ await navigator.clipboard.writeText(link); toast('Link copied'); }
      catch(err){ toast(link); }
      break;
    }
    case 'csv':    downloadCsv(ordersFor(S.session), `pawsly-${S.session}.csv`); break;
    case 'csvAll': downloadCsv(DB.orders, 'pawsly-all-orders.csv'); break;
    case 'csvRep': downloadCsv(repOrders(), `pawsly-report-${S.rep.venue}-${S.rep.days}.csv`); break;
    case 'sbSave': {
      const url = $('#sbUrl').value.trim().replace(/\/+$/,''), key = $('#sbKey').value.trim();
      if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url)){ toast('URL should look like https://xxxx.supabase.co'); break; }
      if(keyIsSecret(key)){
        toast('That is a SECRET key. Use the publishable key \u2014 a secret key in a web page exposes your whole database.');
        break;
      }
      if(!/^sb_publishable_/.test(key) && !/^eyJ/.test(key)){
        toast('Expected a key starting with sb_publishable_ (or a legacy anon key starting with eyJ)');
        break;
      }
      try{ localStorage.setItem(CONN, JSON.stringify({url,key})); }
      catch(e){ toast('This browser is blocking storage'); break; }
      STORE.cfg = {url,key}; STORE.mode = 'cloud';
      try{
        await load();
        toast(`Connected — ${DB.venues.length} venue${DB.venues.length===1?'':'s'} found. Sign in next.`);
      }catch(e){ toast('Failed: '+e.message+' — did you run the SQL?'); }
      render(); poll(); break;
    }
    case 'sbOff': {
      try{ localStorage.removeItem(CONN); }catch(e){}
      STORE.signOut(); STORE.cfg = {url:'',key:''}; STORE.boot();
      clearInterval(pollT); S.session=null;
      await load(); render(); toast('Disconnected from Supabase');
      break;
    }
    case 'saveBase':
      DB.config.baseUrl = $('#baseUrl').value.trim();
      DB.config.notifyUrl = $('#notifyUrl').value.trim().replace(/\/+$/,'');
      STORE.saveCfg(); render(); toast('Settings saved'); break;
    case 'veSave': {
      const v = venue(S.editVenue); if(!v) break;
      const nm = $('#veName').value.trim();
      if(!nm){ toast('Venue name cannot be empty'); break; }
      v.name = nm;
      v.kind = $('#veKind').value.trim();
      v.city = $('#veCity').value.trim();
      v.payout = $('#vePayout').value.trim() || 'Not set';
      v.active = $('#veActive').value === '1';
      await STORE.saveVenue(v);
      S.editVenue = null; render(); toast(`${nm} updated`);
      break;
    }
    case 'pwOpen':   S.pw = !S.pw; render(); break;
    case 'pwCancel': S.pw = false; render(); break;
    case 'pwSave': {
      const cur = $('#pwCur').value, n1 = $('#pwNew').value, n2 = $('#pwNew2').value;
      if(!cur){ toast('Enter your current password'); break; }
      if(n1.length < 8){ toast('New password must be at least 8 characters'); break; }
      if(n1 !== n2){ toast('The two new passwords do not match'); break; }
      if(n1 === cur){ toast('Choose a password different from the current one'); break; }
      const btn = $('#pwSave'); btn.disabled = true; btn.textContent = 'Saving\u2026';
      try{ await STORE.changePassword(cur, n1); S.pw = false; render(); toast('Password changed'); }
      catch(e){ toast(e.message); btn.disabled = false; btn.textContent = 'Save new password'; }
      break;
    }
    case 'veCancel': S.editVenue = null; render(); break;
    case 'veDelete': {
      const v = venue(S.editVenue); if(!v) break;
      const n = ordersFor(v.code).length;
      if(!confirm(`Delete ${v.name}? Its ${n} orders will lose their venue attribution and the revenue share can never be recalculated. To stop new orders without losing the history, set it to Inactive instead.`)) break;
      await STORE.deleteVenue(v.code);
      S.editVenue = null; render(); toast('Venue deleted');
      break;
    }
    case 'addVenue': {
      if(DB.venues.length>=MAX_BRANCHES){ toast('Branch limit reached ('+MAX_BRANCHES+')'); break; }
      const name = $('#nName').value.trim();
      if(!name){ toast('Enter a venue name'); break; }
      const kind = $('#nKind').value.trim() || 'Dog park';
      const code = name.toUpperCase().replace(/[^A-Z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,14) + '-' + rid(2);
      const v = { code, name, kind, city: $('#nCity').value.trim(),
        rate: Math.min(0.4, Math.max(0, (parseFloat($('#nRate').value)||15)/100)),
        payout: $('#nPayout').value.trim() || 'Not set', active:true };
      DB.venues.push(v); await STORE.saveVenue(v); render();
      toast(`${name} created — code ${code}. Next: set its payment methods and treats in BRANCH_RULES, and create its logins.`);
      break;
    }
  }

  if(d.settle){
    await STORE.settle(d.settle); render(); toast('Marked settled');
  }
});

document.addEventListener('change', async (e)=>{
  const rk = e.target.dataset.rep;
  if(rk){ S.rep[rk] = e.target.value; render(); return; }
  const r = e.target.dataset.rate;
  if(r){
    const v = venue(r);
    v.rate = Math.min(0.4, Math.max(0, (parseFloat(e.target.value)||0)/100));
    await STORE.saveVenue(v); render(); toast(`${v.name}: ${Math.round(v.rate*100)}% revenue share`);
  }
});

function keepForm(){
  if($('#cName')) S.cust = { name:$('#cName').value, phone:$('#cPhone').value, dog:$('#cDog').value };
  if($('#cNote')) S.note = $('#cNote').value;
}

function printBanner(id){
  const el = $('#'+id); if(!el){ toast('Nothing to print'); return; }
  const w = window.open('', '_blank', 'width=700,height=900');
  if(!w){ toast('Allow pop-ups to print'); return; }
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Pawsly x-banner</title>
  <style>body{margin:0;background:#FDF1DC;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}
  .xb{text-align:center;padding:40px}
  .xb svg{width:340px;height:340px}
  .qr{background:#fff;padding:18px;display:inline-block;border-radius:12px}
  :root{--ink:#12351F;--text-soft:#4A6B57;--display:'Trebuchet MS',system-ui,sans-serif}
  .k{font-size:38px;font-weight:800;color:#12351F;margin:16px 0 4px}.s{color:#4A6B57}
  .qr{background:#fff;padding:16px;display:inline-block;border:3px solid #12351F;border-radius:18px;margin-top:18px}
  .v{font-weight:800;color:#12351F;margin-top:16px;font-size:20px}.f{font-size:12px;color:#4A6B57}</style></head>
  <body>${el.outerHTML.replace(/class="xb"/,'class="xb"')}</body></html>`);
  w.document.close();
  setTimeout(()=>w.print(), 400);
}

/* ---------- idle sign-out for staff (shared tablets at branches) ---------- */
let lastTouch = 0;
function touch(){
  const n = Date.now(); if(n - lastTouch < 10000) return; lastTouch = n;
  try{ localStorage.setItem('pawsly:act', String(n)); }catch(e){}
}
['click','keydown','touchstart','scroll'].forEach(ev=>document.addEventListener(ev, touch, {passive:true, capture:true}));
setInterval(async ()=>{
  if(!STORE.signedIn) return;
  let act = lastTouch; try{ act = Number(localStorage.getItem('pawsly:act')||lastTouch); }catch(e){}
  if(act && Date.now()-act > IDLE_MS){
    STORE.signOut(); S.session=null; clearInterval(pollT);
    await load(); render(); toast('Signed out after 30 minutes of inactivity');
  }
}, 30000);

/* ---------- boot ---------- */
(async function boot(){
  const params = new URLSearchParams(location.search);
  const hash = new URLSearchParams(location.hash.replace(/^#\/?/, ''));
  await load();
  const v = (params.get('v') || hash.get('v') || '').trim();
  const vn = v ? venue(v) : null;
  S.askedFor = v;                                          // reported on screen if it fails
  if(vn && vn.active !== false) S.venueCode = vn.code;     // inactive QR stops taking orders
  else if(vn) S.closedVenue = vn.name;
  if(location.hash.includes('partner')) S.route='partner';
  if(location.hash.includes('hq')) S.route='hq';
  render();
  poll();
})();

</script>
