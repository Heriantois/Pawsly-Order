<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pawsly — Pesan di Venue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:ital,wght@0,400;0,600;0,700;0,900;1,400&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --ink:#12351F;
  --ink-2:#1D5435;
  --ink-3:#2F6B45;
  --cream:#FDF1DC;
  --cream-2:#FAE4C2;
  --bone:#FFFBF2;
  --marigold:#E89C2A;
  --marigold-dk:#C87A14;
  --line:rgba(18,53,31,.16);
  --line-strong:rgba(18,53,31,.32);
  --text:#12351F;
  --text-soft:#4A6B57;
  --surface:#FFFBF2;
  --page:#FDF1DC;
  --panel:#FAE4C2;
  --pill-text:#FFFBF2;
  --good:#1D7A4C;
  --warn:#B8701A;
  --bad:#A33327;
  --shadow:0 2px 0 rgba(18,53,31,.10);
  --r-s:10px; --r-m:18px; --r-l:28px;
  --display:"Baloo 2", ui-rounded, "SF Pro Rounded", "Trebuchet MS", system-ui, sans-serif;
  --body:"Nunito Sans", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --ink:#F2E4C9;
    --ink-2:#8FD4A8;
    --ink-3:#6FBE8C;
    --cream:#0E2316;
    --cream-2:#17301F;
    --bone:#14291B;
    --marigold:#F0A93C;
    --marigold-dk:#E89C2A;
    --line:rgba(242,228,201,.18);
    --line-strong:rgba(242,228,201,.34);
    --text:#F2E4C9;
    --text-soft:#A8BFAF;
    --surface:#14291B;
    --page:#0E2316;
    --panel:#17301F;
    --pill-text:#0E2316;
    --good:#6FD39A;
    --warn:#F0A93C;
    --bad:#E88877;
    --shadow:0 2px 0 rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--page);
  color:var(--text);
  font-family:var(--body);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--ink-2)}
:focus-visible{outline:3px solid var(--marigold);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.wrap{max-width:560px;margin:0 auto;padding:0 16px 120px}
.wrap.wide{max-width:1040px}
.hidden{display:none!important}

/* ---------- venue ribbon ---------- */
.ribbon{
  background:var(--ink);color:#FFFBF2;
  padding:8px 16px;font-size:13.5px;font-weight:700;
  display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap;
}
.ribbon .dot{width:7px;height:7px;border-radius:50%;background:var(--marigold);flex:none}
.ribbon small{font-weight:600;opacity:.75}

/* ---------- masthead ---------- */
.mast{text-align:center;padding:22px 0 10px}
.logo{
  font-family:var(--display);font-weight:800;font-size:44px;line-height:.9;
  letter-spacing:-.02em;color:var(--ink);margin:0;
}
.logo .paws{display:block;font-size:14px;letter-spacing:.3em;margin-bottom:2px;color:var(--ink-2)}
.tag{font-size:11px;letter-spacing:.18em;font-weight:700;color:var(--text-soft);margin:4px 0 0;text-transform:uppercase}
.h1{
  font-family:var(--display);font-weight:800;font-size:clamp(28px,8vw,40px);
  line-height:1;margin:18px 0 4px;color:var(--ink);
}
.lede{color:var(--text-soft);margin:0 auto;max-width:44ch;font-size:15px}

/* ---------- step heading ---------- */
.step{display:flex;align-items:baseline;gap:10px;margin:32px 0 12px}
.step b{
  font-family:var(--display);font-size:22px;font-weight:800;color:var(--ink);line-height:1.1
}
.step i{
  font-style:normal;font-size:12.5px;font-weight:700;color:var(--marigold-dk);
  background:var(--cream-2);border-radius:999px;padding:3px 9px;white-space:nowrap
}

/* ---------- size cards ---------- */
.sizes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.size{
  background:var(--surface);border:2px solid var(--line);border-radius:var(--r-m);
  padding:12px 8px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;
  transition:border-color .12s, transform .12s;
}
.size[aria-pressed="true"]{border-color:var(--ink);background:var(--cream-2)}
.size[aria-pressed="true"] .bowl{transform:translateY(-2px)}
.size .nm{font-family:var(--display);font-weight:800;font-size:17px;color:var(--ink);line-height:1}
.size .px{font-weight:900;font-size:13.5px;color:var(--ink-2)}
.size .sub{font-size:10.5px;color:var(--text-soft);line-height:1.25;min-height:2.4em}

/* drawn bowl */
.bowl{position:relative;width:100%;max-width:86px;aspect-ratio:1/.78;transition:transform .15s}
.bowl .food{
  position:absolute;left:14%;right:14%;top:4%;height:34%;
  border-radius:50% 50% 40% 40%;
  background:
    radial-gradient(circle at 20% 60%, #6E8F3F 0 14%, transparent 15%),
    radial-gradient(circle at 46% 36%, #8C5A2B 0 17%, transparent 18%),
    radial-gradient(circle at 70% 62%, #E07B2A 0 13%, transparent 14%),
    radial-gradient(circle at 33% 22%, #D9A441 0 11%, transparent 12%),
    radial-gradient(circle at 82% 34%, #4F7A33 0 10%, transparent 11%),
    #A9762F;
}
.bowl .body{
  position:absolute;left:4%;right:4%;top:28%;bottom:0;
  background:linear-gradient(180deg,var(--bone) 0%, var(--cream-2) 100%);
  border:2px solid var(--line-strong);
  border-radius:12px 12px 46% 46% / 8px 8px 60% 60%;
  clip-path:polygon(0 0,100% 0,88% 100%,12% 100%);
}
.bowl .mark{
  position:absolute;left:0;right:0;top:52%;text-align:center;
  font-family:var(--display);font-weight:800;font-size:11px;color:var(--ink);opacity:.75
}
.size.s .bowl{max-width:62px}
.size.m .bowl{max-width:76px}
.size.l .bowl{max-width:92px}

/* ---------- recipe chips ---------- */
.recipes{display:grid;gap:10px}
.recipe{
  display:flex;gap:12px;align-items:center;text-align:left;width:100%;
  background:var(--surface);border:2px solid var(--line);border-radius:var(--r-m);padding:12px 14px
}
.recipe:hover{border-color:var(--line-strong)}
.recipe .n{
  flex:none;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#FFFBF2;
  display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:16px
}
.recipe .t{font-family:var(--display);font-weight:700;font-size:17px;color:var(--ink);line-height:1.15}
.recipe .d{font-size:12.5px;color:var(--text-soft)}

/* ---------- ingredient groups ---------- */
.group{margin:18px 0 0;background:var(--surface);border:2px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.group > header{
  background:var(--ink);color:#FFFBF2;padding:9px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px
}
.group > header h3{font-family:var(--display);font-weight:700;font-size:16px;margin:0;letter-spacing:.01em}
.group > header span{font-size:12px;font-weight:700;opacity:.8}
.group.full > header span{color:var(--marigold);opacity:1}
.picks{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:12px 10px}
@media (max-width:420px){.picks{grid-template-columns:repeat(3,1fr)}}
.pick{
  display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 2px 9px;
  border:2px solid transparent;border-radius:14px;transition:border-color .12s,background .12s
}
.pick[aria-pressed="true"]{border-color:var(--ink);background:var(--cream-2)}
.pick[disabled]{opacity:.34}
.pick .med{
  width:46px;height:46px;border-radius:50%;background:var(--bone);
  border:2px solid var(--line);position:relative;overflow:hidden;flex:none
}
.pick[aria-pressed="true"] .med{border-color:var(--ink)}
.pick .lb{font-size:11.5px;font-weight:700;line-height:1.2;text-align:center;color:var(--text)}
.pick .chk{
  position:absolute;right:-3px;top:-3px;width:17px;height:17px;border-radius:50%;
  background:var(--marigold);color:#12351F;font-size:11px;font-weight:900;display:none;place-items:center
}
.pick[aria-pressed="true"] .chk{display:grid}
.medwrap{position:relative}

/* ---------- addons ---------- */
.addon{
  display:flex;align-items:center;gap:12px;background:var(--surface);
  border:2px solid var(--line);border-radius:var(--r-m);padding:11px 14px;width:100%;text-align:left
}
.addon[aria-pressed="true"]{border-color:var(--ink);background:var(--cream-2)}
.addon .t{font-weight:700;font-size:15px}
.addon .d{font-size:12.5px;color:var(--text-soft)}
.addon .p{margin-left:auto;font-weight:900;color:var(--ink-2);white-space:nowrap}

/* ---------- forms ---------- */
.field{display:block;margin:12px 0}
.field > span{display:block;font-size:13px;font-weight:700;margin-bottom:5px;color:var(--text)}
.field > span em{font-style:normal;font-weight:600;color:var(--text-soft)}
input[type=text],input[type=tel],input[type=number],input[type=password],select,textarea{
  width:100%;background:var(--bone);border:2px solid var(--line);border-radius:var(--r-s);
  padding:10px 12px;color:var(--text)
}
input::placeholder,textarea::placeholder{color:var(--text-soft);opacity:.7}
textarea{min-height:68px;resize:vertical}
.radios{display:grid;gap:8px}
.radio{
  display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:2px solid var(--line);
  border-radius:var(--r-s);padding:11px 13px;width:100%;text-align:left
}
.radio[aria-pressed="true"]{border-color:var(--ink);background:var(--cream-2)}
.radio .mk{
  flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--line-strong);margin-top:2px;
  display:grid;place-items:center
}
.radio[aria-pressed="true"] .mk{border-color:var(--ink)}
.radio[aria-pressed="true"] .mk::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--ink)}
.radio .t{font-weight:700;font-size:14.5px;line-height:1.25}
.radio .d{font-size:12.5px;color:var(--text-soft)}
.radio .p{margin-left:auto;font-weight:800;font-size:13.5px;white-space:nowrap}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--ink);color:#FFFBF2;border-radius:999px;padding:13px 22px;
  font-family:var(--display);font-weight:700;font-size:17px;box-shadow:var(--shadow)
}
.btn.block{display:flex;width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line-strong);box-shadow:none}
.btn.gold{background:var(--marigold);color:#12351F}
.btn.sm{padding:8px 15px;font-size:14.5px}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.btn.danger{background:transparent;color:var(--bad);border:2px solid var(--bad);box-shadow:none}

/* ---------- sticky bar ---------- */
.sticky{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--surface);border-top:2px solid var(--line-strong);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));
}
.sticky .inner{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.sticky .sum{line-height:1.2}
.sticky .sum b{font-family:var(--display);font-size:19px;display:block;color:var(--ink)}
.sticky .sum span{font-size:11.5px;color:var(--text-soft)}
.sticky .btn{margin-left:auto;flex:none}

/* ---------- receipt / summary ---------- */
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-m);padding:16px}
.card + .card{margin-top:12px}
.rows{display:grid;gap:7px;font-size:14.5px}
.row{display:flex;gap:12px;justify-content:space-between;align-items:baseline}
.row span:last-child{font-weight:700;white-space:nowrap}
.row.total{border-top:2px dashed var(--line-strong);padding-top:9px;margin-top:3px;font-size:17px}
.row.total span{font-family:var(--display);font-weight:800}
.row.muted span{color:var(--text-soft);font-weight:600}
.tix{
  text-align:center;background:var(--ink);color:#FFFBF2;border-radius:var(--r-m);padding:22px 16px
}
.tix .code{font-family:var(--display);font-weight:800;font-size:38px;letter-spacing:.04em;line-height:1}
.tix .lbl{font-size:12.5px;opacity:.8;margin-top:4px}
.chip{
  display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;
  font-size:12px;font-weight:800
}
.chip.paid{background:rgba(29,122,76,.16);color:var(--good)}
.chip.pending{background:rgba(184,112,26,.16);color:var(--warn)}
.chip.cash{background:rgba(163,51,39,.14);color:var(--bad)}
.chip.neutral{background:var(--cream-2);color:var(--text-soft)}

.bowlline{font-size:13.5px;color:var(--text-soft);line-height:1.45}
.bowlline b{color:var(--text)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;background:var(--cream-2);padding:4px;border-radius:999px;margin:14px 0}
.tabs button{
  flex:1;padding:8px 6px;border-radius:999px;font-weight:800;font-size:13.5px;color:var(--text-soft)
}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* ---------- dashboard ---------- */
.dash-top{background:var(--ink);color:#FFFBF2;padding:18px 0 56px;margin-bottom:-44px}
.dash-top .wrap{padding-bottom:0}
.dash-top h2{font-family:var(--display);font-size:26px;margin:0;font-weight:800}
.dash-top p{margin:2px 0 0;font-size:13.5px;opacity:.78}
.dash-top .out{margin-left:auto;color:#FFFBF2;border:2px solid rgba(255,251,242,.35);border-radius:999px;padding:6px 14px;font-weight:700;font-size:13.5px}
.dash-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

@media(max-width:620px){.dash-top .dash-head > div:first-child{padding-right:78px}}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-m);padding:13px 14px}
.kpi .k{font-size:12px;font-weight:700;color:var(--text-soft)}
.kpi .v{font-family:var(--display);font-weight:800;font-size:25px;color:var(--ink);line-height:1.15;margin-top:2px}
.kpi .n{font-size:11.5px;color:var(--text-soft)}
.kpi.hero{background:var(--marigold);border-color:var(--marigold-dk)}
.kpi.hero .k,.kpi.hero .n{color:#3A2A08}
.kpi.hero .v{color:#12351F}

.chartwrap{margin-top:12px}
svg.chart{display:block;width:100%;height:170px;overflow:visible}
.chart .bar{fill:var(--ink-3)}
.chart .bar.today{fill:var(--marigold)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart text{font-size:9.5px;fill:var(--text-soft);font-family:var(--body);font-weight:700}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{
  text-align:left;font-size:11.5px;color:var(--text-soft);font-weight:800;
  padding:0 8px 7px;border-bottom:2px solid var(--line)
}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;white-space:nowrap}
td b{font-weight:800}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

.note{
  background:var(--cream-2);border-left:4px solid var(--marigold);border-radius:0 var(--r-s) var(--r-s) 0;
  padding:11px 14px;font-size:13.5px;color:var(--text)
}
.note b{display:block;margin-bottom:2px}

/* ---------- banner preview ---------- */
.xb{
  background:var(--cream);border:2px solid var(--line-strong);border-radius:var(--r-m);
  padding:26px 20px;text-align:center;max-width:320px;margin:0 auto
}
.xb .k{font-family:var(--display);font-weight:800;font-size:27px;color:var(--ink);line-height:1.05;margin:10px 0 2px}
.xb .s{font-size:13px;color:var(--text-soft);margin-bottom:16px}
.xb .qr{background:#FFFBF2;border-radius:14px;padding:12px;display:inline-block;border:2px solid var(--ink)}
.xb .qr svg{display:block;width:170px;height:170px}
.xb .v{margin-top:14px;font-weight:800;font-size:14px;color:var(--ink)}
.xb .f{font-size:11.5px;color:var(--text-soft);margin-top:3px;word-break:break-all}

/* ---------- misc ---------- */
.switcher{
  position:fixed;right:10px;top:10px;z-index:60;display:flex;gap:4px;
  background:var(--surface);border:2px solid var(--line-strong);border-radius:999px;padding:3px
}
.switcher button{padding:5px 11px;border-radius:999px;font-size:12px;font-weight:800;color:var(--text-soft)}
.switcher button[aria-current="true"]{background:var(--ink);color:#FFFBF2}
.empty{text-align:center;padding:34px 18px;color:var(--text-soft)}
.empty b{display:block;font-family:var(--display);font-size:19px;color:var(--ink);margin-bottom:4px}
.foot{text-align:center;font-size:12.5px;color:var(--text-soft);margin-top:28px}
.toast{
  position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:80;
  background:var(--ink);color:#FFFBF2;padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;
  box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:88vw;text-align:center
}
.grid2{display:grid;gap:12px}
@media(min-width:760px){.grid2{grid-template-columns:1.25fr .75fr;align-items:start}}
hr.sep{border:none;border-top:2px dashed var(--line);margin:18px 0}
.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lvl{font-size:12.5px;color:var(--text-soft);margin:6px 0 0}
</style>
</head>
<body>
<div id="switcher" class="switcher"></div>
<main id="app" aria-live="polite"></main>
<div id="sticky"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
/* ============================================================
   Pawsly — venue QR ordering + partner revenue share
   ============================================================ */

const KEY = 'pawsly:v1';
const DEFAULT_RATE = 0.15;        // 15% to the venue

/* ============================================================
   BRAND — edit these five lines to rebrand the whole app
   ============================================================ */
const BRAND = {
  name:    'Pawsly Gourmet',              // wordmark text, used when logo is empty
  tagline: "Your pet's personal chef",    // small caps line under the logo
  logo:    'Logo.png',                    // must match the uploaded filename EXACTLY, capitals included
  logoH:   54,                            // logo height in px on the customer page
  bannerHeadline: 'Give The Very best for your Pet',   // the big line on the printed x-banner
  bannerSub: 'Pick, Mix, Delivered it to You',
};
function logoMark(size, suffix){
  const tail = suffix ? ` <span style="font-family:var(--body);font-size:${Math.round(size*0.42)}px;font-weight:700;color:var(--text-soft)">${esc(suffix)}</span>` : '';
  return (BRAND.logo
    ? `<img src="${esc(BRAND.logo)}" alt="${esc(BRAND.name)}" style="height:${size}px;width:auto;vertical-align:middle">`
    : `<span class="paws">\u{1F43E} \u{1F43E}</span>${esc(BRAND.name)}`) + tail;
}

/* ---------- catalogue ---------- */
const SIZES = [
  { id:'S', name:'Small',  price:26000,  cls:'s', sub:'Small Portion, Big Love' },
  { id:'M', name:'Medium', price:57500,  cls:'m', sub:'Enough, Full Loaded Nutrition' },
  { id:'L', name:'Large',  price:115000, cls:'l', sub:'Huge Love, Bazzinga Nutrition' },
];

const GROUPS = [
  { id:'protein', title:'Protein', max:2, items:[
    { id:'ayam',   label:'Ayam',   c1:'#F6CFC9', c2:'#E3A79E', shape:'blob' },
    { id:'sapi',   label:'Sapi',   c1:'#C2342B', c2:'#8E201A', shape:'dice' },
    { id:'pork',   label:'Pork',   c1:'#E79A9A', c2:'#F3DCD4', shape:'dice' },
    { id:'lamb',   label:'Lamb',   c1:'#A82E2E', c2:'#D98B7E', shape:'blob' },
    { id:'rabbit', label:'Rabbit', c1:'#F0D6CB', c2:'#DCB4A4', shape:'blob' },
  ]},
  { id:'organ', title:'Organ', max:2, items:[
    { id:'liver_ayam', label:'Liver Ayam', c1:'#6B2016', c2:'#3F100A', shape:'blob' },
    { id:'liver_sapi', label:'Liver Sapi', c1:'#55180F', c2:'#2E0A06', shape:'blob' },
  ]},
  { id:'sayuran', title:'Sayuran', max:2, items:[

const rp  = n => 'Rp ' + Math.round(n||0).toLocaleString('id-ID');

const dayKey = d => { const x=new Date(d); const p=n=>String(n).padStart(2,'0');
                      return `${x.getFullYear()}-${p(x.getMonth()+1)}-${p(x.getDate())}`; };

function medallion(it){
  if(it.img) return `center/cover no-repeat url("${it.img}")`;   // photo wins when present
  const dots = {
    dice:   [[30,34,22],[66,44,20],[46,70,19]],
    blob:   [[36,40,27],[66,58,23],[44,74,16]],
    floret: [[32,36,18],[58,30,16],[70,56,19],[40,66,18],[56,72,14]],
    grain:  [[28,38,13],[50,30,12],[68,44,13],[38,58,12],[60,64,13],[44,74,11]],
  }[it.shape] || [[50,50,28]];
  const layers = dots.map((d,i)=>`radial-gradient(circle at ${d[0]}% ${d[1]}%, ${i%2?it.c2:it.c1} 0 ${d[2]}%, transparent ${d[2]+1}%)`);
  return layers.join(',') + `, color-mix(in srgb, ${it.c1} 18%, transparent)`;
}

const STORE = {
  mode:'memory', canLocal:false, cfg:{url:'',key:''},

  boot(){
    try{
      localStorage.setItem('pawsly:probe','1'); localStorage.removeItem('pawsly:probe');
      this.canLocal = true;
      const c = JSON.parse(localStorage.getItem(CONN)||'null');
      if(c && c.url && c.key) this.cfg = c;
    }catch(e){ this.canLocal = false; }
    this.mode = (this.cfg.url && this.cfg.key) ? 'cloud' : (this.canLocal ? 'device' : 'memory');
  },
  label(){ return { cloud:'Supabase — semua perangkat', device:'Perangkat ini saja', memory:'Sementara — tidak tersimpan' }[this.mode]; },

  async api(path, opts={}){
    const r = await fetch(this.cfg.url.replace(/\/+$/,'') + '/rest/v1/' + path, Object.assign({}, opts, {
      headers: Object.assign({
        apikey:this.cfg.key, Authorization:'Bearer '+this.cfg.key,
        'Content-Type':'application/json', Prefer:'return=minimal',
      }, opts.headers||{}),
    }));
    if(!r.ok) throw new Error(r.status + ' ' + (await r.text()).slice(0,140));
    return r.status===204 ? null : r.json();
  },
  get read(){ return { headers:{ Prefer:'return=representation' } }; },

  localCfg(){
    let c={}; try{ c = JSON.parse(localStorage.getItem(CFGK)||'{}'); }catch(e){}
    return Object.assign({ rate:DEFAULT_RATE, notifyUrl:'', baseUrl: location.href.split('#')[0].split('?')[0] }, c);
  },
  saveCfg(){ try{ localStorage.setItem(CFGK, JSON.stringify({ baseUrl:DB.config.baseUrl, notifyUrl:DB.config.notifyUrl })); }catch(e){} },

  async loadAll(){
    if(this.mode==='cloud'){
      const [v,o] = await Promise.all([
        this.api('venues?select=*&order=name.asc', this.read),
        this.api('orders?select='+ORDER_COLS+'&order=created_at.asc&limit=3000', this.read),
      ]);
      return { venues:v.map(fromRowVenue), orders:o.map(fromRowOrder) };
    }
    if(this.mode==='device'){
      try{ const raw = localStorage.getItem(KEY); if(raw) return JSON.parse(raw); }catch(e){}
    }
    return null;
  },

  async persist(){
    if(this.mode!=='device') return;
    try{ localStorage.setItem(KEY, JSON.stringify({ venues:DB.venues, orders:DB.orders.slice(-800) })); }
    catch(e){ toast('Penyimpanan perangkat penuh'); }
  },

  async addOrder(o){
    DB.orders.push(o);
    if(this.mode!=='cloud') return this.persist();
    try{ await this.api('orders', { method:'POST', body:JSON.stringify(toRowOrder(o)) }); }
    catch(e){ toast('Pesanan tersimpan lokal, server gagal: '+e.message); }
  },

  async saveVenue(v){
    if(this.mode!=='cloud') return this.persist();
    try{ await this.api('venues?on_conflict=code', { method:'POST', headers:{ Prefer:'resolution=merge-duplicates' }, body:JSON.stringify(toRowVenue(v)) }); }
    catch(e){ toast('Gagal simpan venue: '+e.message); }
  },

  async settle(code){
    ordersFor(code).forEach(o=>o.settled=true);
    if(this.mode!=='cloud') return this.persist();
    try{ await this.api('orders?venue_code=eq.'+encodeURIComponent(code), { method:'PATCH', body:JSON.stringify({ settled:true }) }); }
    catch(e){ toast('Gagal update server: '+e.message); }
  },

  async deleteVenue(code){
    DB.venues = DB.venues.filter(v=>v.code!==code);
    if(this.mode!=='cloud') return this.persist();
    try{ await this.api('venues?code=eq.'+encodeURIComponent(code), { method:'DELETE' }); }
    catch(e){ toast('Gagal hapus di server: '+e.message); }
  },

  async pushAll(){
    await this.api('venues?on_conflict=code', { method:'POST', headers:{ Prefer:'resolution=merge-duplicates' }, body:JSON.stringify(DB.venues.map(toRowVenue)) });
    for(let i=0;i<DB.orders.length;i+=150){
      await this.api('orders?on_conflict=id', { method:'POST', headers:{ Prefer:'resolution=merge-duplicates' }, body:JSON.stringify(DB.orders.slice(i,i+150).map(toRowOrder)) });
    }
  },

  async wipe(){
    if(this.mode!=='cloud') return this.persist();
    await this.api('orders?id=not.is.null', { method:'DELETE' });
    await this.api('venues?code=not.is.null', { method:'DELETE' });
  },
};

/* Best effort: the order is already saved before this runs, so a WhatsApp
   failure never costs the customer their order. Only an order code goes out --
   the Worker reads the number from Supabase and writes the message itself. */
async function notify(o){
  const url = (DB.config.notifyUrl||'').trim();
  if(!url || STORE.mode!=='cloud') return;
  try{
    const r = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ code:o.code }) });
    if(!r.ok) console.warn('notify', r.status, (await r.text()).slice(0,120));
  }catch(e){ console.warn('notify failed', e); }
}

async function load(){
  STORE.boot();
  let data = null;
  try{ data = await STORE.loadAll(); }
  catch(e){
    toast('Server tidak terjangkau — pakai data perangkat');
    STORE.mode = STORE.canLocal ? 'device' : 'memory';
    try{ data = await STORE.loadAll(); }catch(e2){}
  }
  const fresh = !data || !data.venues || !data.venues.length;
  DB = fresh ? seed() : data;
  DB.config = STORE.localCfg();
  if(!DB.orders) DB.orders = [];
  if(!DB.venues || !DB.venues.length) DB.venues = seed().venues;
  if(fresh) await STORE.persist();
}

function seed(){
  const venues = [
    { code:'PAWS',         name:'PawS',          kind:'Dog pool & Play park', city:'Gading Serpong', pin:'1510', rate:0.10, payout:'BCA 2290xxxx81 · PT Paw Park Nusantara', active:true },
    { code:'PUPPY-AFFAIR', name:'Puppy Affair',  kind:'Pet Groomer',          city:'Gading Serpong', pin:'2208', rate:0.10, payout:'Mandiri 1270xxxx44 · CV Splash Paws',    active:true },
  ];
  const orders = [];
  const names = ['Dira','Bagas','Nadya','Reno','Kiki','Tomi','Sasha','Yoga','Mila','Fajar','Intan','Bram','Sinta','Danu'];
  const dogs  = ['Mochi','Bubu','Kopi','Luna','Bolt','Nori','Cimol','Zuzu','Oreo','Pablo','Gembul','Sushi'];
  for(let d=13; d>=0; d--){
    const n = d===0 ? 3 + Math.floor(Math.random()*4) : 2 + Math.floor(Math.random()*6);
    for(let i=0;i<n;i++){
      // Weight the first venue a little heavier, but never index past the list.
      // (Hardcoding index 2 here broke the moment the venue list dropped to two.)
      const vi = Math.random() < 0.5 ? 0 : 1 + Math.floor(Math.random() * Math.max(1, venues.length - 1));
      const v = venues[Math.min(vi, venues.length - 1)];
      const size = SIZES[Math.random()<.3?0:(Math.random()<.65?1:2)];
      const pay = PAYMENTS[Math.floor(Math.random()*PAYMENTS.length)];
      const ful = Math.random()<.35 ? FULFIL[1] : FULFIL[0];
      const add = Math.random()<.3 ? [ADDONS[Math.floor(Math.random()*ADDONS.length)]] : [];
      const when = new Date(); when.setDate(when.getDate()-d);
      when.setHours(9+Math.floor(Math.random()*9), Math.floor(Math.random()*60), 0, 0);
      const subtotal = size.price + add.reduce((s,a)=>s+a.price,0);
      const fee = ful.fee||0;
      const rate = v.rate;
      orders.push({
        id: 'o'+when.getTime()+i,
        code: 'PW-'+rid(4),
        venueCode: v.code,
        createdAt: when.toISOString(),
        size: size.id, sizeName: size.name,
        pick: samplePick(),
        addons: add.map(a=>({id:a.id,label:a.label,price:a.price})),
        fulfil: ful.id, fee,
        payment: pay.id, paymentLabel: pay.label, collect: pay.collect,
        status: d===0 && i===0 ? 'preparing' : 'served',
        cust:{ name:names[Math.floor(Math.random()*names.length)], phone:'08xx-xxxx-'+(1000+Math.floor(Math.random()*8999)), dog:dogs[Math.floor(Math.random()*dogs.length)] },
        subtotal, total: subtotal+fee,
        rate, commission: Math.round(subtotal*rate),
        settled: d>6,
      });
    }
  }
  orders.sort((a,b)=> new Date(a.createdAt)-new Date(b.createdAt));
  return { venues, orders, config:{ rate:DEFAULT_RATE }, seededAt:new Date().toISOString() };
}
function samplePick(){
  const p = {};
  GROUPS.forEach(g=>{
    const k = 1 + (Math.random()<.45?1:0);
    p[g.id] = [...g.items].sort(()=>Math.random()-.5).slice(0,Math.min(k,g.items.length)).map(i=>i.id);
  });
  return p;
}

/* ---------- derived ---------- */
const venue = code => DB.venues.find(v=>v.code===code);
const ordersFor = code => DB.orders.filter(o=>o.venueCode===code);
function totals(list){
  const gmv = list.reduce((s,o)=>s+o.total,0);
  const com = list.reduce((s,o)=>s+o.commission,0);
  const cash = list.filter(o=>o.collect==='venue');
  const cashHeld = cash.reduce((s,o)=>s+o.total,0);
  const cashCom = cash.reduce((s,o)=>s+o.commission,0);
  return { n:list.length, gmv, com, cashHeld, owedToPawsly: cashHeld-cashCom, avg: list.length? gmv/list.length : 0 };
}
function byDay(list, days=14){
  const out = [];
  for(let d=days-1; d>=0; d--){
    const dt = new Date(); dt.setDate(dt.getDate()-d);
    const k = dayKey(dt);
    const rows = list.filter(o=>dayKey(o.createdAt)===k);
    out.push({ k, ...totals(rows) });
  }
  return out;
}

  document.body.appendChild(el);

}
function qrSvg(text, px=170){
  if(typeof qrcode !== 'function') return `<div style="width:${px}px;height:${px}px;display:grid;place-items:center;font-size:11px;padding:8px;text-align:center">QR tidak termuat.<br>Pakai tautan di bawah.</div>`;
  try{
    const q = qrcode(0,'M'); q.addData(text); q.make();
    return q.createSvgTag({ cellSize:4, margin:1, scalable:true });
  }catch(e){ return '<div style="padding:12px;font-size:11px">Tautan terlalu panjang untuk QR.</div>'; }
}

  const base = (DB.config.baseUrl||'').replace(/[?#].*$/,'');

}

async function placeOrder(){
  const name = ($('#cName')||{}).value?.trim() || '';
  const phone = ($('#cPhone')||{}).value?.trim() || '';
  if(!name || phone.replace(/\D/g,'').length < 9){
    toast('Isi nama dan nomor WhatsApp yang valid');
    const bad = !name ? $('#cName') : $('#cPhone'); if(bad) bad.focus();
    return;
  }
  S.cust = { name, phone, dog: ($('#cDog')||{}).value?.trim()||'' };
  S.note = ($('#cNote')||{}).value?.trim()||'';

  const p = priceNow();
  const v = venue(S.venueCode);
  const rate = v ? v.rate : 0;
  const pay = PAYMENTS.find(m=>m.id===S.payment);
  const btn = $('#payNow'); if(btn){ btn.disabled = true; btn.textContent = 'Memproses…'; }

  const order = {
    id:'o'+Date.now(), code:'PW-'+rid(4),
    venueCode: S.venueCode || null,
    createdAt: new Date().toISOString(),
    size:S.size, sizeName:p.size.name,
    pick: JSON.parse(JSON.stringify(S.pick)),
    addons: S.addons.map(id=>{const a=ADDONS.find(x=>x.id===id);return {id:a.id,label:a.label,price:a.price};}),
    fulfil:S.fulfil, fee:p.fee,
    payment:pay.id, paymentLabel:pay.label, collect:pay.collect,
    status: pay.collect==='venue' ? 'awaiting_cash' : 'preparing',
    cust:{...S.cust}, note:S.note,
    subtotal:p.subtotal, total:p.total,
    rate, commission: Math.round(p.subtotal*rate),
    settled:false,
  };
  await STORE.addOrder(order);
  notify(order);
  S.lastOrder = order; S.stage = 'done';
  render();
  window.scrollTo(0,0);
}

function chart(series, key='gmv'){
  const w=100, h=100, max=Math.max(1,...series.map(d=>d[key]));
  const bw = w/series.length;
  const bars = series.map((d,i)=>{
    const bh = (d[key]/max)*78;
    const last = i===series.length-1;
    return `<rect class="bar ${last?'today':''}" x="${(i*bw+bw*0.17).toFixed(2)}" y="${(84-bh).toFixed(2)}" width="${(bw*0.66).toFixed(2)}" height="${Math.max(bh,0.6).toFixed(2)}" rx="1.2">
      <title>${fmtDay(d.k)} — ${rp(d[key])} · ${d.n} pesanan</title></rect>`;
  }).join('');
  const labels = series.map((d,i)=> (i%3===0||i===series.length-1)
    ? `<text x="${(i*bw+bw/2).toFixed(2)}" y="95" text-anchor="middle">${fmtDay(d.k).replace(' ','\u00a0')}</text>` : '').join('');
  return `<svg class="chart" viewBox="0 0 100 100" preserveAspectRatio="none" role="img"
    aria-label="Pendapatan ${series.length} hari terakhir, tertinggi ${rp(max)}">
    <line class="gl" x1="0" y1="84.5" x2="100" y2="84.5"/>
    <line class="gl" x1="0" y1="45" x2="100" y2="45" stroke-dasharray="1.5 1.5"/>
    ${bars}${labels}</svg>`;
}

    ${S.editVenue && venue(S.editVenue) ? editVenueCard(venue(S.editVenue)) : ''}

    <div class="step"><b>Tambah venue mitra</b></div>
    <div class="card">
      <div class="grid2">
        <div>
          <label class="field"><span>Nama venue</span><input type="text" id="nName" placeholder="Contoh: Happy Tails Serpong"></label>
          <label class="field"><span>Jenis & kota</span><input type="text" id="nKind" placeholder="Dog pool · Serpong"></label>
        </div>
        <div>
          <label class="field"><span>Bagi hasil (%)</span><input type="number" id="nRate" value="15" min="0" max="40"></label>
          <label class="field"><span>Rekening pembayaran</span><input type="text" id="nPayout" placeholder="BCA 1234567890 · PT ..."></label>
        </div>
      </div>
      <button class="btn block" id="addVenue">Buat venue & QR</button>
      <p class="lvl">Kode venue dan PIN dashboard dibuat otomatis.</p>
    </div>

    <div class="step"><b>Penyimpanan data</b><i>${esc(STORE.label())}</i></div>
    <div class="card">
      ${STORE.mode==='cloud' ? `
        <div class="note"><b>Terhubung ke Supabase</b>Pesanan dari HP pengunjung langsung muncul di dashboard venue, di perangkat mana pun. Dashboard menyegarkan sendiri tiap 20 detik.</div>
      ` : `
        <div class="note"><b>${STORE.mode==='device'?'Tersimpan di perangkat ini saja':'Belum tersimpan'}</b>
        ${STORE.mode==='device'
          ? 'Cukup untuk demo di satu HP, tapi venue tidak akan melihat pesanan yang dibuat di perangkat lain. Hubungkan Supabase untuk pilot sungguhan.'
          : 'Browser ini memblokir penyimpanan, jadi data hilang saat halaman dimuat ulang.'}</div>
      `}
      <label class="field" style="margin-top:12px"><span>Supabase Project URL</span>
        <input type="text" id="sbUrl" placeholder="https://xxxxxxxx.supabase.co" value="${esc(STORE.cfg.url||'')}"></label>
      <label class="field"><span>Anon public key <em>— kunci publik, aman di sisi browser</em></span>
        <input type="text" id="sbKey" placeholder="eyJhbGciOi..." value="${esc(STORE.cfg.key||'')}"></label>
      <div class="inline">
        <button class="btn ghost sm" id="sbSave">${STORE.mode==='cloud'?'Perbarui koneksi':'Hubungkan Supabase'}</button>
        ${STORE.mode==='cloud'?`<button class="btn ghost sm" id="sbSeed">Kirim data saat ini ke server</button>
        <button class="btn danger sm" id="sbOff">Putuskan</button>`:''}
      </div>
      <p class="lvl">Jalankan dulu <b>supabase-setup.sql</b> di SQL Editor Supabase untuk membuat tabelnya.</p>
    </div>

    <div class="step"><b>Pengaturan</b></div>
    <div class="card">
      <label class="field"><span>Alamat dasar untuk QR <em>— tempel URL publik setelah website di-deploy</em></span>
        <input type="text" id="baseUrl" value="${esc(DB.config.baseUrl||'')}"></label>
      <label class="field"><span>Endpoint notifikasi WhatsApp <em>— URL Cloudflare Worker, bukan token Fonnte</em></span>
        <input type="text" id="notifyUrl" placeholder="https://pawsly-wa.xxx.workers.dev" value="${esc(DB.config.notifyUrl||'')}"></label>
      <p class="lvl">${STORE.mode==='cloud' ? (DB.config.notifyUrl?'Notifikasi aktif untuk pesanan baru.':'Kosongkan jika belum pakai Fonnte.') : 'Notifikasi WhatsApp butuh koneksi Supabase dulu.'}</p>
      <div class="inline">
        <button class="btn ghost sm" id="saveBase">Simpan alamat</button>
        <button class="btn ghost sm" id="csvAll">Unduh CSV semua pesanan</button>
        <button class="btn danger sm" id="reset">Hapus data demo</button>
      </div>
    </div>
    <p class="foot">Prototipe. Pembayaran disimulasikan — belum terhubung ke payment gateway.</p>
  </div>`;
}

/* ============================================================
   CSV
   ============================================================ */
function downloadCsv(list, name){
  const head = ['kode','waktu','venue','porsi','protein','organ','sayuran','karbohidrat','tambahan','metode','omzet','persen','bagi_hasil','status_bayar'];
  const body = list.map(o=>[
    o.code, new Date(o.createdAt).toLocaleString('id-ID'), o.venueCode||'-', o.sizeName,
    (o.pick.protein||[]).map(label).join('|'), (o.pick.organ||[]).map(label).join('|'),
    (o.pick.sayuran||[]).map(label).join('|'), (o.pick.karbohidrat||[]).map(label).join('|'),
    o.addons.map(a=>a.label).join('|'), o.paymentLabel, o.total, Math.round(o.rate*100), o.commission,
    o.settled?'lunas':'belum',
  ].map(c=>`"${String(c).replace(/"/g,'""')}"`).join(','));
  const blob = new Blob(['\uFEFF'+[head.join(','),...body].join('\n')],{type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  toast('CSV diunduh');
}

/* ============================================================
   Router + events
   ============================================================ */
function render(){
  const app = $('#app'), st = $('#sticky');
  let html='', sticky='';
  if(S.route==='partner'){
    html = S.session ? viewPartner() : viewLogin();
  }else if(S.route==='hq'){
    html = S.hq ? viewHQ() : viewHqLogin();
  }else{
    if(!S.venueCode) html = viewNoVenue();
    else if(S.stage==='menu'){ html = viewMenu(); sticky = stickyMenu(); }
    else if(S.stage==='checkout'){ html = viewCheckout(); sticky = stickyCheckout(); }
    else html = viewDone();
  }
  app.innerHTML = html;
  st.innerHTML = sticky;
  renderSwitcher();
}

function viewHqLogin(){
  return `<div class="wrap"><header class="mast">
    <h1 class="logo" style="font-size:34px">${logoMark(34,'HQ')}</h1>
    <h2 class="h1" style="font-size:26px">Konsol internal</h2></header>
    <div class="card">
      <label class="field"><span>Kata sandi</span><input type="password" id="hqPin" placeholder="••••••••"></label>
      <button class="btn block" id="doHq">Masuk</button>
      <p class="lvl">Kata sandi demo: <b>pawsly2026</b></p>
    </div></div>`;
}

function renderSwitcher(){
  const sw = $('#switcher');
  const tabs = [['order','Pesan'],['partner','Venue'],['hq','HQ']];
  sw.innerHTML = tabs.map(([k,l])=>`<button data-route="${k}" aria-current="${S.route===k}">${l}</button>`).join('');
}

document.addEventListener('click', async (e)=>{
  const b = e.target.closest('button'); if(!b) return;
  const d = b.dataset;

  if(d.route){ S.route = d.route; if(d.route==='order') S.stage = S.lastOrder&&S.stage==='done'?'done':'menu'; render(); window.scrollTo(0,0); return; }
  if(d.venue){ S.venueCode = d.venue; S.stage='menu'; render(); return; }
  if(d.size){ S.size = d.size; render(); return; }
  if(d.recipe){
    const r = RECIPES.find(x=>x.id===d.recipe);
    S.pick = JSON.parse(JSON.stringify(r.pick)); S.addons = [...r.addons];
    render(); toast(r.title + ' dipilih'); return;
  }
  if(d.g){
    const g = GROUPS.find(x=>x.id===d.g);
    const sel = S.pick[d.g];
    const i = sel.indexOf(d.i);
    if(i>=0) sel.splice(i,1);
    else if(sel.length<g.max) sel.push(d.i);
    else { toast(`Maksimum ${g.max} ${g.title.toLowerCase()}`); return; }
    render(); return;
  }
  if(d.addon){
    const i = S.addons.indexOf(d.addon);
    i>=0 ? S.addons.splice(i,1) : S.addons.push(d.addon);
    render(); return;
  }
  if(d.ful){ S.fulfil = d.ful; keepForm(); render(); return; }
  if(d.pay){ S.payment = d.pay; keepForm(); render(); return; }
  if(d.tab){ S.tab = d.tab; render(); return; }
  if(d.edit){ S.editVenue = (S.editVenue===d.edit ? null : d.edit); render(); return; }

  switch(b.id){
    case 'toCheckout': S.stage='checkout'; render(); window.scrollTo(0,0); break;
    case 'backMenu':   keepForm(); S.stage='menu'; render(); window.scrollTo(0,0); break;
    case 'payNow':     await placeOrder(); break;
    case 'again':
      S.pick={protein:[],organ:[],sayuran:[],karbohidrat:[]}; S.addons=[]; S.stage='menu'; S.lastOrder=null;
      render(); window.scrollTo(0,0); break;
    case 'gotoPartner': S.session = S.lastOrder.venueCode; S.route='partner'; render(); window.scrollTo(0,0); break;
    case 'doLogin': {
      const code = $('#lCode').value, pin = $('#lPin').value.trim();
      const v = venue(code);
      if(v && pin===v.pin){ S.session=code; S.tab='today'; render(); window.scrollTo(0,0); }
      else { toast('PIN salah untuk venue ini'); $('#lPin').focus(); }
      break;
    }
    case 'doHq': {
      if($('#hqPin').value.trim()==='pawsly2026'){ S.hq=true; render(); window.scrollTo(0,0); }
      else { toast('Kata sandi salah'); }
      break;
    }
    case 'logout': S.session=null; S.hq=false; render(); break;
    case 'copyLink': {
      const link = orderLink(S.session);
      try{ await navigator.clipboard.writeText(link); toast('Tautan disalin'); }
      catch(err){ toast(link); }
      break;
    }
    case 'printBanner': printBanner(); break;
    case 'csv':    downloadCsv(ordersFor(S.session), `pawsly-${S.session}.csv`); break;
    case 'csvAll': downloadCsv(DB.orders, 'pawsly-semua-pesanan.csv'); break;
    case 'sbSave': {
      const url = $('#sbUrl').value.trim().replace(/\/+$/,''), key = $('#sbKey').value.trim();
      if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url)){ toast('URL harus seperti https://xxxx.supabase.co'); break; }
      if(key.length < 40){ toast('Anon key tampak belum lengkap'); break; }
      try{ localStorage.setItem(CONN, JSON.stringify({url,key})); }
      catch(e){ toast('Browser ini memblokir penyimpanan'); break; }
      STORE.cfg = {url,key}; STORE.mode = 'cloud';
      try{
        const d = await STORE.loadAll();
        if(d.venues.length){ DB.venues = d.venues; DB.orders = d.orders; toast(`Terhubung — ${d.orders.length} pesanan dimuat`); }
        else toast('Terhubung. Tabel masih kosong — kirim data saat ini untuk mengisinya.');
      }catch(e){ toast('Gagal: '+e.message+' — sudah jalankan SQL-nya?'); }
      render(); poll(); break;
    }
    case 'sbSeed': {
      const b2 = $('#sbSeed'); b2.disabled = true; b2.textContent = 'Mengirim…';
      try{ await STORE.pushAll(); toast(`${DB.venues.length} venue & ${DB.orders.length} pesanan terkirim`); }
      catch(e){ toast('Gagal: '+e.message); }
      render(); break;
    }
    case 'sbOff': {
      try{ localStorage.removeItem(CONN); }catch(e){}
      STORE.cfg = {url:'',key:''}; STORE.boot();
      const d2 = await STORE.loadAll();
      if(d2 && d2.venues && d2.venues.length){ DB.venues = d2.venues; DB.orders = d2.orders; }
      clearInterval(pollT); render(); toast('Koneksi diputus — kembali ke penyimpanan perangkat');
      break;
    }
    case 'saveBase':
      DB.config.baseUrl = $('#baseUrl').value.trim();
      DB.config.notifyUrl = $('#notifyUrl').value.trim().replace(/\/+$/,'');
      STORE.saveCfg(); render(); toast('Pengaturan disimpan'); break;
    case 'veSave': {
      const v = venue(S.editVenue); if(!v) break;
      const nm = $('#veName').value.trim();
      if(!nm){ toast('Nama venue tidak boleh kosong'); break; }
      v.name = nm;
      v.kind = $('#veKind').value.trim();
      v.city = $('#veCity').value.trim();
      v.pin  = $('#vePin').value.trim();
      v.payout = $('#vePayout').value.trim() || 'Belum diisi';
      v.active = $('#veActive').value === '1';
      await STORE.saveVenue(v);
      S.editVenue = null; render(); toast(`${nm} diperbarui`);
      break;
    }
    case 'veCancel': S.editVenue = null; render(); break;
    case 'veDelete': {
      const v = venue(S.editVenue); if(!v) break;
      const n = ordersFor(v.code).length;
      if(!confirm(`Hapus ${v.name}? ${n} pesanan akan kehilangan atribusi venue dan bagi hasilnya tidak bisa dihitung ulang. Untuk menghentikan pesanan baru tanpa kehilangan riwayat, pilih Nonaktif saja.`)) break;
      await STORE.deleteVenue(v.code);
      S.editVenue = null; render(); toast('Venue dihapus');
      break;
    }
    case 'addVenue': {
      const name = $('#nName').value.trim();
      if(!name){ toast('Isi nama venue'); break; }
      const kind = $('#nKind').value.trim() || 'Dog park';
      const code = name.toUpperCase().replace(/[^A-Z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,14) + '-' + rid(2);
      const v = { code, name, kind, city: kind.split('·').pop().trim(), pin:String(1000+Math.floor(Math.random()*8999)),
        rate: Math.min(0.4, Math.max(0, (parseFloat($('#nRate').value)||15)/100)),
        payout: $('#nPayout').value.trim() || 'Belum diisi', active:true };
      DB.venues.push(v); await STORE.saveVenue(v); render();
      toast(`${name} dibuat — kode ${code}, PIN ${v.pin}`);
      break;
    }
    case 'reset': {
      if(!confirm('Hapus semua venue dan pesanan, lalu muat ulang contoh data?')) break;
      try{ await STORE.wipe(); }catch(e){ toast('Gagal hapus di server: '+e.message); break; }
      const cfg = DB.config; DB = seed(); DB.config = cfg;
      if(STORE.mode==='cloud'){ try{ await STORE.pushAll(); }catch(e){ toast('Gagal kirim: '+e.message); } }
      else await STORE.persist();
      S.session=null; S.venueCode=null; render(); toast('Data demo dimuat ulang');
      break;
    }
  }

  if(d.settle){
    await STORE.settle(d.settle); render(); toast('Ditandai lunas');
  }
});

document.addEventListener('change', async (e)=>{
  const r = e.target.dataset.rate;
  if(r){
    const v = venue(r);
    v.rate = Math.min(0.4, Math.max(0, (parseFloat(e.target.value)||0)/100));
    await STORE.saveVenue(v); render(); toast(`${v.name}: bagi hasil ${Math.round(v.rate*100)}%`);
  }
});

function keepForm(){
  if($('#cName')) S.cust = { name:$('#cName').value, phone:$('#cPhone').value, dog:$('#cDog').value };
  if($('#cNote')) S.note = $('#cNote').value;
}

function printBanner(){
  const el = $('#xbanner'); if(!el) return;
  const w = window.open('', '_blank', 'width=700,height=900');
  if(!w){ toast('Izinkan pop-up untuk mencetak'); return; }
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>X-banner Pawsly</title>
  <style>body{margin:0;background:#FDF1DC;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}
  .xb{text-align:center;padding:40px}.xb svg{width:300px;height:300px}
  :root{--ink:#12351F;--text-soft:#4A6B57;--display:'Trebuchet MS',system-ui,sans-serif}
  .k{font-size:38px;font-weight:800;color:#12351F;margin:16px 0 4px}.s{color:#4A6B57}
  .qr{background:#fff;padding:16px;display:inline-block;border:3px solid #12351F;border-radius:18px;margin-top:18px}
  .v{font-weight:800;color:#12351F;margin-top:16px;font-size:20px}.f{font-size:12px;color:#4A6B57}</style></head>
  <body>${el.outerHTML.replace(/class="xb"/,'class="xb"')}</body></html>`);
  w.document.close();
  setTimeout(()=>w.print(), 400);
}

/* ---------- boot ---------- */
(async function boot(){
  const params = new URLSearchParams(location.search);
  const hash = new URLSearchParams(location.hash.replace(/^#\/?/, ''));
  await load();
  const v = params.get('v') || hash.get('v');
  const vn = v ? venue(v) : null;
  if(vn && vn.active !== false) S.venueCode = v;          // inactive QR stops taking orders
  else if(vn) S.closedVenue = vn.name;
  else if(v) toast('Kode venue tidak dikenal');
  if(location.hash.includes('partner')) S.route='partner';
  if(location.hash.includes('hq')) S.route='hq';
  render();
  poll();
})();

</script>
