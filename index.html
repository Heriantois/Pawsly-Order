<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pawsly Gourmet — Order at the Venue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:ital,wght@0,400;0,600;0,700;0,900;1,400&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --ink:#12351F;
  --ink-2:#1D5435;
  --ink-3:#2F6B45;
  --cream:#FDF1DC;
  --cream-2:#FAE4C2;
  --bone:#FFFBF2;
  --marigold:#E89C2A;
  --marigold-dk:#C87A14;
  --line:rgba(18,53,31,.16);
  --line-strong:rgba(18,53,31,.32);
  --text:#12351F;
  --text-soft:#4A6B57;
  --surface:#FFFBF2;
  --page:#FDF1DC;
  --panel:#FAE4C2;
  --pill-text:#FFFBF2;
  --good:#1D7A4C;
  --warn:#B8701A;
  --bad:#A33327;
  --shadow:0 2px 0 rgba(18,53,31,.10);
  --r-s:10px; --r-m:18px; --r-l:28px;
  --display:"Baloo 2", ui-rounded, "SF Pro Rounded", "Trebuchet MS", system-ui, sans-serif;
  --body:"Nunito Sans", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --ink:#F2E4C9;
    --ink-2:#8FD4A8;
    --ink-3:#6FBE8C;
    --cream:#0E2316;
    --cream-2:#17301F;
    --bone:#14291B;
    --marigold:#F0A93C;
    --marigold-dk:#E89C2A;
    --line:rgba(242,228,201,.18);
    --line-strong:rgba(242,228,201,.34);
    --text:#F2E4C9;
    --text-soft:#A8BFAF;
    --surface:#14291B;
    --page:#0E2316;
    --panel:#17301F;
    --pill-text:#0E2316;
    --good:#6FD39A;
    --warn:#F0A93C;
    --bad:#E88877;
    --shadow:0 2px 0 rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  overflow-x:hidden;
  background:var(--page);
  color:var(--text);
  font-family:var(--body);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--ink-2)}
:focus-visible{outline:3px solid var(--marigold);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.wrap{max-width:560px;margin:0 auto;padding:0 16px 120px}
@media(max-width:420px){.wrap{padding:0 12px 120px}}
.wrap.wide{max-width:1040px}
.hidden{display:none!important}

/* ---------- venue ribbon ---------- */
.ribbon{
  background:var(--ink);color:#FFFBF2;
  padding:8px 16px;font-size:13.5px;font-weight:700;
  display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap;
}
.ribbon .dot{width:7px;height:7px;border-radius:50%;background:var(--marigold);flex:none}
.ribbon small{font-weight:600;opacity:.75}

/* ---------- masthead ---------- */
.mast{text-align:center;padding:18px 0 10px}
.logo{
  font-family:var(--display);font-weight:800;font-size:44px;line-height:.9;
  letter-spacing:-.02em;color:var(--ink);margin:0;
}
.logo .paws{display:block;font-size:14px;letter-spacing:.3em;margin-bottom:2px;color:var(--ink-2)}
.tag{font-size:11px;letter-spacing:.18em;font-weight:700;color:var(--text-soft);margin:4px 0 0;text-transform:uppercase}
.h1{
  font-family:var(--display);font-weight:800;font-size:clamp(28px,8vw,40px);
  line-height:1;margin:18px 0 4px;color:var(--ink);
}
.lede{color:var(--text-soft);margin:0 auto;max-width:44ch;font-size:15px}

/* ---------- step heading ---------- */
.step{display:flex;align-items:baseline;gap:10px;margin:32px 0 12px}
.step b{
  font-family:var(--display);font-size:22px;font-weight:800;color:var(--ink);line-height:1.1
}
.step i{
  font-style:normal;font-size:12.5px;font-weight:700;color:var(--marigold-dk);
  background:var(--cream-2);border-radius:999px;padding:3px 9px;white-space:nowrap
}

/* ---------- size cards ---------- */
.sizes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:380px){.size .sub{display:none}}
.size{
  background:var(--surface);border:2px solid var(--line);border-radius:var(--r-m);
  padding:12px 8px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;
  transition:border-color .12s, transform .12s;
}
.size[aria-pressed="true"]{border-color:var(--ink);background:var(--cream-2)}
.size[aria-pressed="true"] .bowl{transform:translateY(-2px)}
.size .nm{font-family:var(--display);font-weight:800;font-size:17px;color:var(--ink);line-height:1}
.size .px{font-weight:900;font-size:13.5px;color:var(--ink-2)}
.size .sub{font-size:10.5px;color:var(--text-soft);line-height:1.25;min-height:2.4em}

/* drawn bowl */
.bowl{display:block;position:relative;width:100%;max-width:86px;aspect-ratio:1/.78;transition:transform .15s}
.bowl .food{
  position:absolute;left:14%;right:14%;top:4%;height:34%;
  border-radius:50% 50% 40% 40%;
  background:
    radial-gradient(circle at 20% 60%, #6E8F3F 0 14%, transparent 15%),
    radial-gradient(circle at 46% 36%, #8C5A2B 0 17%, transparent 18%),
    radial-gradient(circle at 70% 62%, #E07B2A 0 13%, transparent 14%),
    radial-gradient(circle at 33% 22%, #D9A441 0 11%, transparent 12%),
    radial-gradient(circle at 82% 34%, #4F7A33 0 10%, transparent 11%),
    #A9762F;
}
.bowl .body{
  position:absolute;left:4%;right:4%;top:28%;bottom:0;
  background:linear-gradient(180deg,var(--bone) 0%, var(--cream-2) 100%);
  border:2px solid var(--line-strong);
  border-radius:12px 12px 46% 46% / 8px 8px 60% 60%;
  clip-path:polygon(0 0,100% 0,88% 100%,12% 100%);
}
.bowl .mark{
  position:absolute;left:0;right:0;top:52%;text-align:center;
  font-family:var(--display);font-weight:800;font-size:11px;color:var(--ink);opacity:.75
}
.size.s .bowl{max-width:62px}
.size.m .bowl{max-width:76px}
.size.l .bowl{max-width:92px}
.bowlimg{display:block;width:100%;height:auto}
.size.s .bowlimg{max-width:84px}
.size.m .bowlimg{max-width:100px}
.size.l .bowlimg{max-width:116px}

/* ---------- recipe chips ---------- */
.recipes{display:grid;gap:10px}
.recipe{
  display:flex;gap:12px;align-items:center;text-align:left;width:100%;
  background:var(--surface);border:2px solid var(--line);border-radius:var(--r-m);padding:12px 14px
}
.recipe:hover{border-color:var(--line-strong)}
.recipe .n{
  flex:none;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#FFFBF2;
  display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:16px
}
.recipe .t{font-family:var(--display);font-weight:700;font-size:17px;color:var(--ink);line-height:1.15}
.recipe .d{font-size:12.5px;color:var(--text-soft)}

/* ---------- ingredient groups ---------- */
.group{margin:18px 0 0;background:var(--surface);border:2px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.group > header{
  background:var(--ink);color:#FFFBF2;padding:9px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px
}
.group > header h3{font-family:var(--display);font-weight:700;font-size:16px;margin:0;letter-spacing:.01em}
.group > header span{font-size:12px;font-weight:700;opacity:.8}
.group.full > header span{color:var(--marigold);opacity:1}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px;padding:12px 8px}
.pick{
  display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 2px 9px;
  border:2px solid transparent;border-radius:14px;transition:border-color .12s,background .12s
}
.pick[aria-pressed="true"]{border-color:var(--ink);background:var(--cream-2)}
.pick[disabled]{opacity:.34}
.pick .med{
  display:block;width:62px;height:62px;border-radius:50%;background:var(--bone);
  border:2px solid var(--line);position:relative;overflow:hidden;flex:none
}
.pick[aria-pressed="true"] .med{border-color:var(--ink)}
.pick .lb{font-size:12px;font-weight:700;line-height:1.2;text-align:center;color:var(--text);hyphens:auto}
.pick .chk{
  position:absolute;right:-2px;top:-2px;width:20px;height:20px;border-radius:50%;
  background:var(--marigold);color:#12351F;font-size:12px;font-weight:900;display:none;place-items:center;
  box-shadow:0 0 0 2px var(--surface)
}
.pick[aria-pressed="true"] .chk{display:grid}
.medwrap{position:relative;display:inline-block;line-height:0}

/* ---------- addons ---------- */
.addon{
  display:flex;align-items:center;gap:12px;background:var(--surface);
  border:2px solid var(--line);border-radius:var(--r-m);padding:11px 14px;width:100%;text-align:left
}
.addon[aria-pressed="true"]{border-color:var(--ink);background:var(--cream-2)}
.addon .t{font-weight:700;font-size:15px}
.addon .d{font-size:12.5px;color:var(--text-soft)}
.addon .p{margin-left:auto;font-weight:900;color:var(--ink-2);white-space:nowrap}

/* ---------- forms ---------- */
.field{display:block;margin:12px 0}
.field > span{display:block;font-size:13px;font-weight:700;margin-bottom:5px;color:var(--text)}
.field > span em{font-style:normal;font-weight:600;color:var(--text-soft)}
input[type=text],input[type=tel],input[type=number],input[type=password],select,textarea{
  width:100%;background:var(--bone);border:2px solid var(--line);border-radius:var(--r-s);
  padding:10px 12px;color:var(--text)
}
input::placeholder,textarea::placeholder{color:var(--text-soft);opacity:.7}
textarea{min-height:68px;resize:vertical}
.radios{display:grid;gap:8px}
.radio{
  display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:2px solid var(--line);
  border-radius:var(--r-s);padding:11px 13px;width:100%;text-align:left
}
.radio[aria-pressed="true"]{border-color:var(--ink);background:var(--cream-2)}
.radio .mk{
  flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--line-strong);margin-top:2px;
  display:grid;place-items:center
}
.radio[aria-pressed="true"] .mk{border-color:var(--ink)}
.radio[aria-pressed="true"] .mk::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--ink)}
.radio .t{font-weight:700;font-size:14.5px;line-height:1.25}
.radio .d{font-size:12.5px;color:var(--text-soft)}
.radio .p{margin-left:auto;font-weight:800;font-size:13.5px;white-space:nowrap}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--ink);color:#FFFBF2;border-radius:999px;padding:13px 22px;
  font-family:var(--display);font-weight:700;font-size:17px;box-shadow:var(--shadow)
}
.btn.block{display:flex;width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line-strong);box-shadow:none}
.btn.gold{background:var(--marigold);color:#12351F}
.btn.sm{padding:8px 15px;font-size:14.5px}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.btn.danger{background:transparent;color:var(--bad);border:2px solid var(--bad);box-shadow:none}

/* ---------- sticky bar ---------- */
.sticky{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--surface);border-top:2px solid var(--line-strong);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));
}
.sticky .inner{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.sticky .sum{line-height:1.2}
.sticky .sum b{font-family:var(--display);font-size:19px;display:block;color:var(--ink)}
.sticky .sum span{font-size:11.5px;color:var(--text-soft)}
.sticky .btn{margin-left:auto;flex:none}

/* ---------- receipt / summary ---------- */
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-m);padding:16px}
.card + .card{margin-top:12px}
.rows{display:grid;gap:7px;font-size:14.5px}
.row{display:flex;gap:12px;justify-content:space-between;align-items:baseline}
.row span:last-child{font-weight:700;white-space:nowrap}
.row.total{border-top:2px dashed var(--line-strong);padding-top:9px;margin-top:3px;font-size:17px}
.row.total span{font-family:var(--display);font-weight:800}
.row.muted span{color:var(--text-soft);font-weight:600}
.tix{
  text-align:center;background:var(--ink);color:#FFFBF2;border-radius:var(--r-m);padding:22px 16px
}
.tix .code{font-family:var(--display);font-weight:800;font-size:38px;letter-spacing:.04em;line-height:1}
.tix .lbl{font-size:12.5px;opacity:.8;margin-top:4px}
.chip{
  display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;
  font-size:12px;font-weight:800
}
.chip.paid{background:rgba(29,122,76,.16);color:var(--good)}
.chip.pending{background:rgba(184,112,26,.16);color:var(--warn)}
.chip.cash{background:rgba(163,51,39,.14);color:var(--bad)}
.chip.neutral{background:var(--cream-2);color:var(--text-soft)}

.bowlline{font-size:13.5px;color:var(--text-soft);line-height:1.45}
.bowlline b{color:var(--text)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;background:var(--cream-2);padding:4px;border-radius:999px;margin:14px 0}
.tabs button{
  flex:1;padding:8px 6px;border-radius:999px;font-weight:800;font-size:13.5px;color:var(--text-soft)
}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* ---------- dashboard ---------- */
.dash-top{background:var(--ink);color:#FFFBF2;padding:18px 0 56px;margin-bottom:-44px}
.dash-top .wrap{padding-bottom:0}
.dash-top h2{font-family:var(--display);font-size:26px;margin:0;font-weight:800}
.dash-top p{margin:2px 0 0;font-size:13.5px;opacity:.78}
.dash-top .out{margin-left:auto;color:#FFFBF2;border:2px solid rgba(255,251,242,.35);border-radius:999px;padding:6px 14px;font-weight:700;font-size:13.5px}
.dash-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

@media(max-width:620px){.dash-top .dash-head > div:first-child{padding-right:78px}}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-m);padding:13px 14px}
.kpi .k{font-size:12px;font-weight:700;color:var(--text-soft)}
.kpi .v{font-family:var(--display);font-weight:800;font-size:25px;color:var(--ink);line-height:1.15;margin-top:2px}
.kpi .n{font-size:11.5px;color:var(--text-soft)}
.kpi.hero{background:var(--marigold);border-color:var(--marigold-dk)}
.kpi.hero .k,.kpi.hero .n{color:#3A2A08}
.kpi.hero .v{color:#12351F}

.chartwrap{margin-top:12px}
.bars{display:flex;align-items:flex-end;gap:3px;height:150px}
.bars .bar{flex:1;display:flex;flex-direction:column;height:100%;min-width:0}
.bars .col{flex:1;display:flex;align-items:flex-end;background:linear-gradient(var(--line),var(--line)) center/100% 1px no-repeat}
.bars .fill{width:100%;background:var(--ink-3);border-radius:3px 3px 0 0;min-height:2px}
.bars .fill.now{background:var(--marigold)}
.bars .lab{font-size:10px;font-weight:700;color:var(--text-soft);text-align:center;padding-top:5px;
  overflow:hidden;text-overflow:clip;white-space:nowrap}
@media(max-width:480px){.bars .bar:nth-child(even) .lab{visibility:hidden}}
.barscale{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;color:var(--text-soft);margin-top:6px}

table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:430px}
th{
  text-align:left;font-size:11.5px;color:var(--text-soft);font-weight:800;
  padding:0 8px 7px;border-bottom:2px solid var(--line)
}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;white-space:nowrap}
td b{font-weight:800}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

.note{
  background:var(--cream-2);border-left:4px solid var(--marigold);border-radius:0 var(--r-s) var(--r-s) 0;
  padding:11px 14px;font-size:13.5px;color:var(--text)
}
.note b{display:block;margin-bottom:2px}

/* ---------- banner preview ---------- */
.xb{
  background:var(--cream);border:2px solid var(--line-strong);border-radius:var(--r-m);
  padding:26px 20px;text-align:center;max-width:320px;margin:0 auto
}
.xb .k{font-family:var(--display);font-weight:800;font-size:27px;color:var(--ink);line-height:1.05;margin:10px 0 2px}
.xb .s{font-size:13px;color:var(--text-soft);margin-bottom:16px}
.xb .qr{background:#ffffff;border-radius:10px;padding:14px;display:inline-block;border:1px solid rgba(18,53,31,.25)}
.xb .qr svg{display:block;width:200px;height:200px;max-width:58vw}
.xb .v{margin-top:14px;font-weight:800;font-size:14px;color:var(--ink)}
.xb .f{font-size:11.5px;color:var(--text-soft);margin-top:3px;word-break:break-all}

/* ---------- misc ---------- */
.empty{text-align:center;padding:34px 18px;color:var(--text-soft)}
.empty b{display:block;font-family:var(--display);font-size:19px;color:var(--ink);margin-bottom:4px}
.foot{text-align:center;font-size:12.5px;color:var(--text-soft);margin-top:28px}
.toast{
  position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:80;
  background:var(--ink);color:#FFFBF2;padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;
  box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:88vw;text-align:center
}
.grid2{display:grid;gap:12px}
@media(min-width:760px){.grid2{grid-template-columns:1.25fr .75fr;align-items:start}}
hr.sep{border:none;border-top:2px dashed var(--line);margin:18px 0}
.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lvl{font-size:12.5px;color:var(--text-soft);margin:6px 0 0}
.logo img{max-width:86vw;height:auto}
.logo{margin-bottom:6px}
.promo{
  background:var(--marigold);border-radius:var(--r-m);padding:13px 18px;margin:14px 0 2px;
  text-align:center;border:2px solid var(--marigold-dk)
}
.promo b{display:block;font-family:var(--display);font-weight:800;font-size:19px;color:#12351F;line-height:1.15}
.promo span{display:block;font-size:13px;font-weight:600;color:#3A2A08;margin-top:2px}
.xbgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(238px,1fr))}
.xbgrid .xb{max-width:none}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<div id="sticky"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
/* ============================================================
   Pawsly — venue QR ordering + partner revenue share
   ============================================================ */

const KEY = 'pawsly:v1';
const DEFAULT_RATE = 0.10;        // 10% to the venue

/* ============================================================
   BRAND — edit these five lines to rebrand the whole app
   ============================================================ */
const BRAND = {
  name:    'Pawsly Gourmet',              // wordmark text, used when logo is empty
  tagline: "Your pet's personal chef",    // small caps line under the logo
  logo:    'Logo.png',                    // must match the uploaded filename EXACTLY, capitals included
  logoH:   190,                           // logo height in px (capped at 86vw so phones never clip it)
  qrisImage: 'qris.png',                  // your static QRIS sticker, sitting next to index.html
  payeeName: 'Pawsly Gourmet',            // the account name customers should expect to see
  promoTitle: 'Freshly cooked, right here at the park',
  promoLine:  'Pick a portion, mix the toppings, collect at the counter',
  bannerHeadline: 'Give The Very best for your Pet',   // the big line on the printed x-banner
  bannerSub: 'Pick, Mix, Delivered it to You',
};
function logoMark(size, suffix){
  const tail = suffix ? ` <span style="font-family:var(--body);font-size:${Math.round(size*0.42)}px;font-weight:700;color:var(--text-soft)">${esc(suffix)}</span>` : '';
  return (BRAND.logo
    ? `<img src="${esc(BRAND.logo)}" alt="${esc(BRAND.name)}" style="height:${size}px;width:auto;vertical-align:middle">`
    : `<span class="paws">\u{1F43E} \u{1F43E}</span>${esc(BRAND.name)}`) + tail;
}

/* ---------- catalogue ---------- */

function medallion(it){
  const dots = {
    dice:   [[30,34,22],[66,44,20],[46,70,19]],
    blob:   [[36,40,27],[66,58,23],[44,74,16]],
    floret: [[32,36,18],[58,30,16],[70,56,19],[40,66,18],[56,72,14]],
    grain:  [[28,38,13],[50,30,12],[68,44,13],[38,58,12],[60,64,13],[44,74,11]],
  }[it.shape] || [[50,50,28]];
  const layers = dots.map((d,i)=>`radial-gradient(circle at ${d[0]}% ${d[1]}%, ${i%2?it.c2:it.c1} 0 ${d[2]}%, transparent ${d[2]+1}%)`);
  const drawn = layers.join(',') + `, color-mix(in srgb, ${it.c1} 18%, transparent)`;
  // Photo first, drawn version underneath. If the file 404s the browser just
  // skips that layer and the drawn ingredient shows instead of an empty circle.
  // Single quotes are required: this sits inside style="..." .
  return it.img ? `url('${String(it.img).replace(/['"\\]/g,'')}') center/cover no-repeat, ${drawn}` : drawn;
}

/* ---------- storage + auth ----------------------------------------
   Customers never read the orders table. They only call place_order(),
   a SECURITY DEFINER function, so no customer's name, phone or order
   history is reachable with the public anon key.

   Dashboards require a real Supabase Auth sign-in. What a signed-in
   person can see comes from their row in `staff`:
     role 'hq'    -> every venue
     role 'venue' -> only their own venue_code
   Enforced by RLS in the database, not by this file.
-------------------------------------------------------------------- */

/* ============================================================
   DATABASE — fill these two in and commit. Customers scanning a QR
   have never configured anything on their phone, so the connection
   has to ship inside the page.

   The publishable key is MEANT to be public: it carries no privileges
   of its own, and Row Level Security in supabase-setup.sql is what
   actually protects the data. Never put the secret key here.
   ============================================================ */

const STORE = {
  mode:'memory', canLocal:false, cfg:{url:'',key:''}, session:null,

  boot(){
    try{
      localStorage.setItem('pawsly:probe','1'); localStorage.removeItem('pawsly:probe');
      this.canLocal = true;
      const c = JSON.parse(localStorage.getItem(CONN)||'null');
      if(c && c.url && c.key) this.cfg = c;                       // per-device override
      else if(SUPABASE.url && SUPABASE.key) this.cfg = {...SUPABASE};
      const s = JSON.parse(localStorage.getItem(SESS)||'null');
      if(s && s.token) this.session = s;
    }catch(e){
      this.canLocal = false;
      if(SUPABASE.url && SUPABASE.key) this.cfg = {...SUPABASE};   // storage blocked, still works
    }
    this.mode = (this.cfg.url && this.cfg.key) ? 'cloud' : (this.canLocal ? 'device' : 'memory');
    if(this.mode !== 'cloud') this.session = null;
  },
  get live(){ return this.mode==='cloud'; },
  get signedIn(){ return !!(this.session && this.session.role); },
  get isHQ(){ return this.signedIn && this.session.role==='hq'; },
  label(){ return { cloud:'Supabase \u2014 live', device:'This device only', memory:'Temporary \u2014 not saved' }[this.mode]; },

  saveSession(){ try{ this.session ? localStorage.setItem(SESS, JSON.stringify(this.session)) : localStorage.removeItem(SESS); }catch(e){} },

  /* ---- auth ---- */
  async signIn(email, password){
    const r = await fetch(this.cfg.url.replace(/\/+$/,'') + '/auth/v1/token?grant_type=password', {
      method:'POST', headers:{ apikey:this.cfg.key, 'Content-Type':'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const d = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.error_description || d.msg || d.message || ('sign-in failed ('+r.status+')'));
    this.session = { token:d.access_token, refresh:d.refresh_token, email:(d.user||{}).email };
    let rows;
    try{ rows = await this.api('staff?select=role,venue_code&limit=1', this.read); }
    catch(e){ this.session=null; throw new Error('Signed in, but the staff table is unreachable \u2014 did you run the SQL?'); }
    if(!rows || !rows.length){ this.session=null; throw new Error('No staff record for this account. Add a row in the staff table.'); }
    this.session.role = rows[0].role;
    this.session.venueCode = rows[0].venue_code;
    this.saveSession();
  },
  async refresh(){
    if(!this.session || !this.session.refresh) return false;
    try{
      const r = await fetch(this.cfg.url.replace(/\/+$/,'') + '/auth/v1/token?grant_type=refresh_token', {
        method:'POST', headers:{ apikey:this.cfg.key, 'Content-Type':'application/json' },
        body: JSON.stringify({ refresh_token:this.session.refresh }),
      });
      if(!r.ok) return false;
      const d = await r.json();
      this.session.token = d.access_token; this.session.refresh = d.refresh_token;
      this.saveSession();
      return true;
    }catch(e){ return false; }
  },
  signOut(){ this.session = null; this.saveSession(); },

  /* ---- rest ---- */
  async api(path, opts={}, retry=true){
    // The project key always travels on `apikey`. Authorization carries the
    // signed-in user's JWT and NOTHING else -- a publishable key put there
    // gets parsed as a JWT and rejected with "Invalid JWT".
    const head = { apikey:this.cfg.key, 'Content-Type':'application/json', Prefer:'return=minimal' };
    if(this.session && this.session.token) head.Authorization = 'Bearer ' + this.session.token;
    const r = await fetch(this.cfg.url.replace(/\/+$/,'') + '/rest/v1/' + path, Object.assign({}, opts, {
      headers: Object.assign(head, opts.headers||{}),
    }));
    if(r.status===401 && retry && this.session){
      if(await this.refresh()) return this.api(path, opts, false);
      this.signOut();
      throw new Error('session expired, please sign in again');
    }
    if(!r.ok) throw new Error(r.status + ' ' + (await r.text()).slice(0,140));
    return r.status===204 ? null : r.json();
  },
  get read(){ return { headers:{ Prefer:'return=representation' } }; },

  localCfg(){
    let c={}; try{ c = JSON.parse(localStorage.getItem(CFGK)||'{}'); }catch(e){}
    return Object.assign({ rate:DEFAULT_RATE, notifyUrl:'', baseUrl: location.href.split('#')[0].split('?')[0] }, c);
  },
  saveCfg(){ try{ localStorage.setItem(CFGK, JSON.stringify({ baseUrl:DB.config.baseUrl, notifyUrl:DB.config.notifyUrl })); }catch(e){} },

  /* ---- reads ---- */
  async loadAll(){
    if(this.mode==='cloud'){
      const venues = (await this.api('venues?select=*&order=name.asc', this.read)).map(fromRowVenue);
      // Orders are only readable with a staff session; customers never fetch them.
      let orders = [];
      if(this.signedIn){
        orders = (await this.api('orders?select='+ORDER_COLS+'&order=created_at.asc&limit=5000', this.read)).map(fromRowOrder);
      }
      return { venues, orders };
    }
    if(this.mode==='device'){
      try{ const raw = localStorage.getItem(KEY); if(raw) return JSON.parse(raw); }catch(e){}
    }
    return null;
  },

  async persist(){
    if(this.mode!=='device') return;
    try{ localStorage.setItem(KEY, JSON.stringify({ venues:DB.venues, orders:DB.orders.slice(-800) })); }
    catch(e){ toast('Device storage is full'); }
  },

  /* ---- writes ---- */
  async addOrder(o){
    if(this.mode!=='cloud'){
      o.uniq = o.uniq || 0; o.payTotal = o.total + o.uniq;
      DB.orders.push(o); return this.persist();
    }
    // The database assigns the verification code inside one transaction, so two
    // phones ordering at the same second can never be quoted the same amount.
    const res = await this.api('rpc/place_order', {
      method:'POST', headers:{ Prefer:'return=representation' },
      body: JSON.stringify({ p: orderPayload(o) }),
    });
    const d = Array.isArray(res) ? res[0] : res;
    if(d){ o.id = d.id || o.id; o.uniq = d.uniq || 0; o.payTotal = d.pay_total || o.total; }
    DB.orders.push(o);
  },

  async saveVenue(v){
    if(this.mode!=='cloud') return this.persist();
    try{ await this.api('venues?on_conflict=code', { method:'POST', headers:{ Prefer:'resolution=merge-duplicates' }, body:JSON.stringify(toRowVenue(v)) }); }
    catch(e){ toast('Could not save venue: '+e.message); }
  },
  async settle(code){
    ordersFor(code).forEach(o=>o.settled=true);
    if(this.mode!=='cloud') return this.persist();
    try{ await this.api('orders?venue_code=eq.'+encodeURIComponent(code), { method:'PATCH', body:JSON.stringify({ settled:true }) }); }
    catch(e){ toast('Server update failed: '+e.message); }
  },
  async settleOrder(id){
    const o = DB.orders.find(x=>x.id===id); if(!o) return;
    o.settled = true;
    if(this.mode!=='cloud') return this.persist();
    try{ await this.api('orders?id=eq.'+encodeURIComponent(id), { method:'PATCH', body:JSON.stringify({ settled:true }) }); }
    catch(e){ toast('Server update failed: '+e.message); }
  },
  async deleteVenue(code){
    DB.venues = DB.venues.filter(v=>v.code!==code);
    if(this.mode!=='cloud') return this.persist();
    try{ await this.api('venues?code=eq.'+encodeURIComponent(code), { method:'DELETE' }); }
    catch(e){ toast('Server delete failed: '+e.message); }
  },
};

/* Best effort, and deliberately after the order is stored: a WhatsApp
   failure must never cost the customer their order. Only an order code
   goes out -- the Worker reads the number from the database itself. */
async function notify(o){
  const url = (DB.config.notifyUrl||'').trim();
  if(!url || !STORE.live) return;
  try{
    const r = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ code:o.code }) });
    if(!r.ok) console.warn('notify', r.status, (await r.text()).slice(0,120));
  }catch(e){ console.warn('notify failed', e); }
}

  clearInterval(pollT);

    if(S.route==='order' || !STORE.signedIn) return;

    try{

      if(rows.length !== DB.orders.length){ DB.orders = rows.map(fromRowOrder); render(); }
    }catch(e){}
  }, 20000);
}

const venue = code => DB.venues.find(v=>v.code===code);
const ordersFor = code => DB.orders.filter(o=>o.venueCode===code);
function totals(list){
  const gmv = list.reduce((s,o)=>s+o.total,0);
  const com = list.reduce((s,o)=>s+o.commission,0);
  const cash = list.filter(o=>o.collect==='venue');
  const cashHeld = cash.reduce((s,o)=>s+o.total,0);
  const cashCom = cash.reduce((s,o)=>s+o.commission,0);
  return { n:list.length, gmv, com, cashHeld, owedToPawsly: cashHeld-cashCom, avg: list.length? gmv/list.length : 0 };
}
function byDay(list, days=14){
  const out = [];
  for(let d=days-1; d>=0; d--){
    const dt = new Date(); dt.setDate(dt.getDate()-d);
    const k = dayKey(dt);
    const rows = list.filter(o=>dayKey(o.createdAt)===k);
    out.push({ k, ...totals(rows) });
  }
  return out;
}

  const el = document.createElement('div');

  document.body.appendChild(el);

/* Drawn by hand rather than with createSvgTag, because three things decide
   whether a phone can actually read this:
     - a 4-module quiet zone. The spec requires it; scanners use that clear
       border to find the code. The old margin:1 is why nothing would scan.
     - pure #000 on pure #fff. Cream at #FFFBF2 cuts contrast for no reason.
     - shape-rendering=crispEdges, so modules don't get antialiased into grey
       fringes when the viewBox scales to a fractional pixel size. */
function qrSvg(text, px=200){
  if(typeof qrcode !== 'function')
    return `<div style="width:${px}px;height:${px}px;display:grid;place-items:center;font-size:11px;padding:8px;text-align:center">QR did not load.<br>Use the link below.</div>`;
  try{
    const q = qrcode(0,'M');
    q.addData(text);
    q.make();
    const n = q.getModuleCount(), quiet = 4, box = n + quiet*2;
    let d = '';
    for(let row=0; row<n; row++)
      for(let col=0; col<n; col++)
        if(q.isDark(row,col)) d += `M${col+quiet} ${row+quiet}h1v1h-1z`;
    return `<svg viewBox="0 0 ${box} ${box}" width="${px}" height="${px}" `
         + `shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="QR code">`
         + `<rect width="${box}" height="${box}" fill="#ffffff"/>`
         + `<path d="${d}" fill="#000000"/></svg>`;
  }catch(e){ return '<div style="padding:12px;font-size:11px">Link is too long for a QR code.</div>'; }
}
function orderLink(code){
  const base = (DB.config.baseUrl||'').replace(/[?#].*$/,'');
  return base + '?v=' + encodeURIComponent(code);
}

function priceNow(){
  const size = SIZES.find(s=>s.id===S.size) || SIZES[0];
  const addon = S.addons.reduce((t,id)=>t+(ADDONS.find(a=>a.id===id)||{price:0}).price,0);
  const fee = (FULFIL.find(f=>f.id===S.fulfil)||{}).fee||0;
  const subtotal = size.price + addon;
  const total = subtotal + fee;
  const pay = PAYMENTS.find(m=>m.id===S.payment) || PAYMENTS[0];
  const uniq = pay.uniq ? (S.uniq || 0) : 0;
  return { size, addon, fee, subtotal, total, pay, uniq, payTotal: total + uniq };
}

/* A 2-digit code appended to the amount so a bank or QRIS entry maps to exactly
   one order: Rp 115,000 becomes Rp 115,012. Only codes already attached to an
   unsettled order are off-limits, so numbers are recycled once reconciled.
   The code is NOT revenue -- commission is still taken on the food subtotal. */
function pickUniq(){
  const used = new Set(DB.orders.filter(o=>!o.settled && o.uniq).map(o=>o.uniq));
  const free = [];
  for(let i=1;i<=99;i++) if(!used.has(i)) free.push(i);
  return free.length ? free[Math.floor(Math.random()*free.length)]
                     : 1 + Math.floor(Math.random()*99);
}
function bowlReady(){
  return S.pick.protein.length>0 && S.pick.karbohidrat.length>0;
}
function bowlText(pick){
  return GROUPS.map(g=>{
    const list=(pick[g.id]||[]).map(label);
    return list.length? `<b>${g.title}:</b> ${esc(list.join(', '))}` : null;
  }).filter(Boolean).join(' · ');
}

async function placeOrder(){
  const name = ($('#cName')||{}).value?.trim() || '';
  const phone = ($('#cPhone')||{}).value?.trim() || '';
  if(!name || phone.replace(/\D/g,'').length < 9){
    toast('Enter your name and a valid WhatsApp number');
    const bad = !name ? $('#cName') : $('#cPhone'); if(bad) bad.focus();
    return;
  }
  S.cust = { name, phone, dog: ($('#cDog')||{}).value?.trim()||'' };
  S.note = ($('#cNote')||{}).value?.trim()||'';

  const p = priceNow();
  const v = venue(S.venueCode);
  const rate = v ? v.rate : 0;
  const pay = PAYMENTS.find(m=>m.id===S.payment) || PAYMENTS[0];
  const btn = $('#payNow'); if(btn){ btn.disabled = true; btn.textContent = 'Processing…'; }

  const order = {
    id:'o'+Date.now(), code:'PW-'+rid(4),
    venueCode: S.venueCode || null,
    createdAt: new Date().toISOString(),
    size:S.size, sizeName:p.size.name,
    pick: JSON.parse(JSON.stringify(S.pick)),
    addons: S.addons.map(id=>{const a=ADDONS.find(x=>x.id===id);return {id:a.id,label:a.label,price:a.price};}),
    fulfil:S.fulfil, fee:p.fee,
    payment:pay.id, paymentLabel:pay.label, collect:pay.collect,
    status: pay.collect==='venue' ? 'awaiting_cash' : 'preparing',
    cust:{...S.cust}, note:S.note,
    subtotal:p.subtotal, total:p.total, uniq:p.uniq, payTotal:p.payTotal,
    rate, commission: Math.round(p.subtotal*rate),
    settled:false,
  };
  await STORE.addOrder(order);
  notify(order);
  S.lastOrder = order; S.stage = 'done';
  render();
  window.scrollTo(0,0);
}

function chart(series, key='gmv'){
  const max = Math.max(1, ...series.map(d=>d[key]));
  return `<div class="bars">${series.map((d,i)=>{
    const pct = Math.max(2, Math.round(d[key]/max*100));
    const last = i===series.length-1;
    return `<div class="bar" title="${fmtDay(d.k)} \u2014 ${rp(d[key])}, ${d.n} orders">
      <div class="col"><div class="fill ${last?'now':''}" style="height:${pct}%"></div></div>
      <div class="lab">${fmtDay(d.k).split(' ')[0]}</div>
    </div>`;
  }).join('')}</div>
  <div class="barscale"><span>${rpk(max)}</span><span>latest ${rp(series[series.length-1][key])}</span></div>`;
}

        <label class="field"><span>Type</span><input type="text" id="veKind" value="${esc(v.kind||'')}"></label>
        <label class="field"><span>City</span><input type="text" id="veCity" value="${esc(v.city||'')}"></label>

    <div class="inline" style="margin-top:12px">

      <button class="btn ghost sm" id="veCancel">Cancel</button>

}

function bannerArt(v, id='xbanner'){

  return `<div class="xb" id="${id}">

    <div class="k">${esc(BRAND.bannerHeadline)}</div>

    <div class="v">${esc(v.name)}</div>

  </div>`;
}

/* ============================================================
   Pawsly HQ
   ============================================================ */

  const payable = all.filter(o=>!o.settled && o.collect==='pawsly').reduce((s,o)=>s+o.commission,0);
  const receivable = all.filter(o=>!o.settled && o.collect==='venue').reduce((s,o)=>s+o.total-o.commission,0);

  return `
  <div class="dash-top"><div class="wrap wide">
    <div class="dash-head">
      <div><h2>Pawsly HQ</h2><p>Venue network, revenue share and settlement</p></div>
      <button class="out" id="logout">Sign out</button>

    <div class="kpis">

      <div class="kpi"><div class="k">Revenue, 14 days</div><div class="v">${rpk(t.gmv)}</div><div class="n">${t.n} orders</div></div>
      <div class="kpi"><div class="k">Share owed to venues</div><div class="v">${rpk(payable)}</div><div class="n">for Pawsly to transfer</div></div>

    <div class="step"><b>Partner venues</b><i>${DB.venues.length} listed</i></div>
    <div class="card" style="padding:14px 10px">
      <div class="tscroll"><table>
        <thead><tr><th>Venue</th><th class="num">Share</th><th class="num">Orders</th><th class="num">Revenue 14d</th><th class="num">Owed</th><th></th></tr></thead>
        <tbody>${DB.venues.map(v=>{
          const list = ordersFor(v.code);
          const due = list.filter(o=>!o.settled && o.collect==='pawsly').reduce((s,o)=>s+o.commission,0);

          return `<tr>
            <td><b>${esc(v.name)}</b>${v.active===false?' <span class="chip neutral">inactive</span>':''}<br><span style="color:var(--text-soft);font-size:11.5px">${esc(v.code)} · ${esc(v.city)}</span></td>

            <td class="num">${due?`<b>${rp(due)}</b>`:'—'}${cash?`<br><span class="chip cash" style="margin-top:3px">cash ${rpk(cash)}</span>`:''}</td>
            <td class="num"><div class="inline" style="justify-content:flex-end">
              ${(due||cash)?`<button class="btn ghost sm" data-settle="${esc(v.code)}">Mark settled</button>`:''}
              <button class="btn ghost sm" data-edit="${esc(v.code)}">Edit</button>
            </div></td>
          </tr>`;
        }).join('')}</tbody></table></div>
    </div>

    ${S.editVenue && venue(S.editVenue) ? editVenueCard(venue(S.editVenue)) : ''}

    <div class="step"><b>Add a partner venue</b></div>
    <div class="card">
      <div class="grid2">
        <div>
          <label class="field"><span>Venue name</span><input type="text" id="nName" placeholder="e.g. Happy Tails Serpong"></label>
          <label class="field"><span>Type</span><input type="text" id="nKind" placeholder="Dog pool & play park"></label>
          <label class="field"><span>City</span><input type="text" id="nCity" placeholder="Gading Serpong"></label>
        </div>
        <div>
          <label class="field"><span>Revenue share (%)</span><input type="number" id="nRate" value="15" min="0" max="40"></label>
          <label class="field"><span>Payout account</span><input type="text" id="nPayout" placeholder="BCA 1234567890 · PT ..."></label>

      </div>
      <button class="btn block" id="addVenue">Create venue & QR</button>
      <p class="lvl">The venue code and dashboard PIN are generated automatically.</p>
    </div>

    ${(()=>{
      const pending = all.filter(o=>!o.settled && o.collect==='pawsly' && o.uniq)
                        .sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt));

      <div class="step"><b>Payments to verify</b><i>${pending.length} waiting</i></div>

    <div class="step"><b>QR codes for every branch</b><i>Print ready</i></div>
    <div class="card">

      <div class="xbgrid">
        ${DB.venues.filter(v=>v.active!==false).map(v=>`
          <div>
            ${bannerArt(v, 'xb-'+v.code)}
            <div class="inline" style="justify-content:center;margin-top:8px">
              <button class="btn ghost sm" data-print="xb-${esc(v.code)}">Print</button>

    </div>

    <div class="step"><b>Data storage</b><i>${esc(STORE.label())}</i></div>
    <div class="card">
      ${STORE.mode==='cloud' ? `
        <div class="note"><b>Connected to Supabase</b>Orders placed on a visitor’s phone appear on the venue dashboard on any device. Dashboards refresh themselves every 20 seconds.</div>
      ` : `
        <div class="note"><b>${STORE.mode==='device'?'Saved on this device only':'Not being saved'}</b>
        ${STORE.mode==='device'
          ? 'Fine for a demo on one phone, but a venue will not see orders placed on any other device. Connect Supabase for a real pilot.'
          : 'This browser is blocking storage, so data is lost when the page reloads.'}</div>
      `}
      <label class="field" style="margin-top:12px"><span>Supabase Project URL</span>
        <input type="text" id="sbUrl" placeholder="https://xxxxxxxx.supabase.co" value="${esc(STORE.cfg.url||'')}"></label>
      <label class="field"><span>Publishable key <em>— Settings › API Keys. Never the secret key</em></span>
        <input type="text" id="sbKey" placeholder="sb_publishable_..." value="${esc(STORE.cfg.key||'')}"></label>
      <div class="inline">
        <button class="btn ghost sm" id="sbSave">${STORE.mode==='cloud'?'Update connection':'Connect Supabase'}</button>
        ${STORE.mode==='cloud'?`<button class="btn danger sm" id="sbOff">Disconnect</button>`:''}
      </div>
      <p class="lvl">Run <b>supabase-setup.sql</b> in the Supabase SQL editor first to create the tables.</p>
    </div>

    <div class="step"><b>Settings</b></div>
    <div class="card">
      <label class="field"><span>Base address for QR codes <em>— paste the public URL after deploying</em></span>
        <input type="text" id="baseUrl" value="${esc(DB.config.baseUrl||'')}"></label>
      <label class="field"><span>WhatsApp notification endpoint <em>— the Cloudflare Worker URL, not your Fonnte token</em></span>
        <input type="text" id="notifyUrl" placeholder="https://pawsly-wa.xxx.workers.dev" value="${esc(DB.config.notifyUrl||'')}"></label>
      <p class="lvl">${STORE.mode==='cloud' ? (DB.config.notifyUrl?'Notifications are on for new orders.':'Leave empty if you are not using Fonnte yet.') : 'WhatsApp notifications need a Supabase connection first.'}</p>
      <div class="inline">
        <button class="btn ghost sm" id="saveBase">Save settings</button>
        <button class="btn ghost sm" id="csvAll">Download all orders as CSV</button>
      </div>
    </div>
    <p class="foot">Prototype. Payments are simulated — not yet connected to a payment gateway.</p>
  </div>`;
}

/* ============================================================
   CSV
   ============================================================ */
function downloadCsv(list, name){
  const head = ['code','time','venue','size','protein','organ','vegetables','carbs','addons','payment','revenue','pay_amount','share_pct','venue_share','settlement'];
  const body = list.map(o=>[
    o.code, new Date(o.createdAt).toLocaleString('en-GB'), o.venueCode||'-', o.sizeName,
    (o.pick.protein||[]).map(label).join('|'), (o.pick.organ||[]).map(label).join('|'),
    (o.pick.sayuran||[]).map(label).join('|'), (o.pick.karbohidrat||[]).map(label).join('|'),
    o.addons.map(a=>a.label).join('|'), o.paymentLabel, o.total, o.payTotal||o.total, Math.round(o.rate*100), o.commission,
    o.settled?'settled':'pending',
  ].map(c=>`"${String(c).replace(/"/g,'""')}"`).join(','));
  const blob = new Blob(['\uFEFF'+[head.join(','),...body].join('\n')],{type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  toast('CSV downloaded');
}

/* ============================================================
   Router + events
   ============================================================ */
function render(){
  const app = $('#app'), st = $('#sticky');
  let html='', sticky='';
  if(S.route==='partner' || S.route==='hq'){
    if(!STORE.live)            html = viewConnect();
    else if(!STORE.signedIn)   html = viewSignIn();
    else if(STORE.isHQ)        html = viewHQ();          // Pawsly staff: every branch
    else if(S.session)         html = viewPartner();     // venue partner: their branch
    else                       html = viewSignIn();
  }else{
    if(!S.venueCode) html = viewNoVenue();
    else if(S.stage==='menu'){ html = viewMenu(); sticky = stickyMenu(); }
    else if(S.stage==='checkout'){ html = viewCheckout(); sticky = stickyCheckout(); }
    else html = viewDone();
  }
  app.innerHTML = html;
  st.innerHTML = sticky;
}

document.addEventListener('click', async (e)=>{
  const b = e.target.closest('button'); if(!b) return;
  const d = b.dataset;

  if(d.route){ S.route = d.route; if(d.route==='order') S.stage = S.lastOrder&&S.stage==='done'?'done':'menu'; render(); window.scrollTo(0,0); return; }
  if(d.venue){ S.venueCode = d.venue; S.stage='menu'; render(); return; }
  if(d.size){ S.size = d.size; render(); return; }
  if(d.recipe){
    const r = RECIPES.find(x=>x.id===d.recipe);
    S.pick = JSON.parse(JSON.stringify(r.pick)); S.addons = [...r.addons];
    render(); toast(r.title + ' selected'); return;
  }
  if(d.g){
    const g = GROUPS.find(x=>x.id===d.g);
    const sel = S.pick[d.g];
    const i = sel.indexOf(d.i);
    if(i>=0) sel.splice(i,1);
    else if(sel.length<g.max) sel.push(d.i);
    else { toast(`Maximum ${g.max} ${g.title.toLowerCase()}`); return; }
    render(); return;
  }
  if(d.addon){
    const i = S.addons.indexOf(d.addon);
    i>=0 ? S.addons.splice(i,1) : S.addons.push(d.addon);
    render(); return;
  }
  if(d.ful){ S.fulfil = d.ful; keepForm(); render(); return; }
  if(d.pay){ S.payment = d.pay; keepForm(); render(); return; }
  if(d.tab){ S.tab = d.tab; render(); return; }
  if(d.edit){ S.editVenue = (S.editVenue===d.edit ? null : d.edit); render(); return; }
  if(d.print){ printBanner(d.print); return; }
  if(d.paid){ await STORE.settleOrder(d.paid); render(); toast('Marked received'); return; }

  switch(b.id){
    case 'toCheckout': S.uniq = STORE.live ? 0 : pickUniq(); S.stage='checkout'; render(); window.scrollTo(0,0); break;
    case 'backMenu':   keepForm(); S.stage='menu'; render(); window.scrollTo(0,0); break;
    case 'payNow':     await placeOrder(); break;
    case 'again':
      S.pick={protein:[],organ:[],sayuran:[],karbohidrat:[]}; S.addons=[]; S.stage='menu'; S.lastOrder=null;
      S.payment=PAYMENTS[0].id; S.fulfil=FULFIL[0].id; S.uniq=null;
      render(); window.scrollTo(0,0); break;
    case 'doSignIn': {
      const email = $('#aEmail').value.trim(), pass = $('#aPass').value;
      if(!email || !pass){ toast('Enter your email and password'); break; }
      const btn = $('#doSignIn'); btn.disabled = true; btn.textContent = 'Signing in\u2026';
      try{
        await STORE.signIn(email, pass);
        S.session = STORE.session.venueCode || null;
        S.route = STORE.isHQ ? 'hq' : 'partner';
        S.tab = 'today';
        await load();
        toast('Signed in as ' + (STORE.isHQ ? 'Pawsly staff' : (venue(S.session)||{name:'venue'}).name));
        render(); poll(); window.scrollTo(0,0);
      }catch(e){
        toast(e.message);
        btn.disabled = false; btn.textContent = 'Sign in';
      }
      break;
    }
    case 'sbForget': {
      try{ localStorage.removeItem(CONN); }catch(e){}
      STORE.signOut(); STORE.cfg={url:'',key:''}; STORE.boot();
      await load(); render(); toast('Database details cleared');
      break;
    }
    case 'logout':
      STORE.signOut(); S.session=null; clearInterval(pollT);
      await load(); render(); toast('Signed out'); break;
    case 'copyLink': {
      const link = orderLink(S.session);
      try{ await navigator.clipboard.writeText(link); toast('Link copied'); }
      catch(err){ toast(link); }
      break;
    }
    case 'csv':    downloadCsv(ordersFor(S.session), `pawsly-${S.session}.csv`); break;
    case 'csvAll': downloadCsv(DB.orders, 'pawsly-all-orders.csv'); break;
    case 'sbSave': {
      const url = $('#sbUrl').value.trim().replace(/\/+$/,''), key = $('#sbKey').value.trim();
      if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url)){ toast('URL should look like https://xxxx.supabase.co'); break; }
      if(/^sb_secret_/.test(key) || /service_role/.test(key)){
        toast('That is a SECRET key. Use the publishable key \u2014 a secret key in a web page exposes your whole database.');
        break;
      }
      if(!/^sb_publishable_/.test(key) && !/^eyJ/.test(key)){
        toast('Expected a key starting with sb_publishable_ (or a legacy anon key starting with eyJ)');
        break;
      }
      try{ localStorage.setItem(CONN, JSON.stringify({url,key})); }
      catch(e){ toast('This browser is blocking storage'); break; }
      STORE.cfg = {url,key}; STORE.mode = 'cloud';
      try{
        await load();
        toast(`Connected — ${DB.venues.length} venue${DB.venues.length===1?'':'s'} found. Sign in next.`);
      }catch(e){ toast('Failed: '+e.message+' — did you run the SQL?'); }
      render(); poll(); break;
    }
    case 'sbOff': {
      try{ localStorage.removeItem(CONN); }catch(e){}
      STORE.signOut(); STORE.cfg = {url:'',key:''}; STORE.boot();
      clearInterval(pollT); S.session=null;
      await load(); render(); toast('Disconnected from Supabase');
      break;
    }
    case 'saveBase':
      DB.config.baseUrl = $('#baseUrl').value.trim();
      DB.config.notifyUrl = $('#notifyUrl').value.trim().replace(/\/+$/,'');
      STORE.saveCfg(); render(); toast('Settings saved'); break;
    case 'veSave': {
      const v = venue(S.editVenue); if(!v) break;
      const nm = $('#veName').value.trim();
      if(!nm){ toast('Venue name cannot be empty'); break; }
      v.name = nm;
      v.kind = $('#veKind').value.trim();
      v.city = $('#veCity').value.trim();
      v.payout = $('#vePayout').value.trim() || 'Not set';
      v.active = $('#veActive').value === '1';
      await STORE.saveVenue(v);
      S.editVenue = null; render(); toast(`${nm} updated`);
      break;
    }
    case 'veCancel': S.editVenue = null; render(); break;
    case 'veDelete': {
      const v = venue(S.editVenue); if(!v) break;
      const n = ordersFor(v.code).length;
      if(!confirm(`Delete ${v.name}? Its ${n} orders will lose their venue attribution and the revenue share can never be recalculated. To stop new orders without losing the history, set it to Inactive instead.`)) break;
      await STORE.deleteVenue(v.code);
      S.editVenue = null; render(); toast('Venue deleted');
      break;
    }
    case 'addVenue': {
      const name = $('#nName').value.trim();
      if(!name){ toast('Enter a venue name'); break; }
      const kind = $('#nKind').value.trim() || 'Dog park';
      const code = name.toUpperCase().replace(/[^A-Z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,14) + '-' + rid(2);
      const v = { code, name, kind, city: $('#nCity').value.trim(),
        rate: Math.min(0.4, Math.max(0, (parseFloat($('#nRate').value)||15)/100)),
        payout: $('#nPayout').value.trim() || 'Not set', active:true };
      DB.venues.push(v); await STORE.saveVenue(v); render();
      toast(`${name} created — code ${code}. Add its manager to the staff table to grant access.`);
      break;
    }
  }

  if(d.settle){
    await STORE.settle(d.settle); render(); toast('Marked settled');
  }
});

document.addEventListener('change', async (e)=>{
  const r = e.target.dataset.rate;
  if(r){
    const v = venue(r);
    v.rate = Math.min(0.4, Math.max(0, (parseFloat(e.target.value)||0)/100));
    await STORE.saveVenue(v); render(); toast(`${v.name}: ${Math.round(v.rate*100)}% revenue share`);
  }
});

function keepForm(){
  if($('#cName')) S.cust = { name:$('#cName').value, phone:$('#cPhone').value, dog:$('#cDog').value };
  if($('#cNote')) S.note = $('#cNote').value;
}

function printBanner(id){
  const el = $('#'+id); if(!el){ toast('Nothing to print'); return; }
  const w = window.open('', '_blank', 'width=700,height=900');
  if(!w){ toast('Allow pop-ups to print'); return; }
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Pawsly x-banner</title>
  <style>body{margin:0;background:#FDF1DC;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}
  .xb{text-align:center;padding:40px}
  .xb svg{width:340px;height:340px}
  .qr{background:#fff;padding:18px;display:inline-block;border-radius:12px}
  :root{--ink:#12351F;--text-soft:#4A6B57;--display:'Trebuchet MS',system-ui,sans-serif}
  .k{font-size:38px;font-weight:800;color:#12351F;margin:16px 0 4px}.s{color:#4A6B57}
  .qr{background:#fff;padding:16px;display:inline-block;border:3px solid #12351F;border-radius:18px;margin-top:18px}
  .v{font-weight:800;color:#12351F;margin-top:16px;font-size:20px}.f{font-size:12px;color:#4A6B57}</style></head>
  <body>${el.outerHTML.replace(/class="xb"/,'class="xb"')}</body></html>`);
  w.document.close();
  setTimeout(()=>w.print(), 400);
}

/* ---------- boot ---------- */
(async function boot(){
  const params = new URLSearchParams(location.search);
  const hash = new URLSearchParams(location.hash.replace(/^#\/?/, ''));
  await load();
  const v = params.get('v') || hash.get('v');
  const vn = v ? venue(v) : null;
  if(vn && vn.active !== false) S.venueCode = v;          // inactive QR stops taking orders
  else if(vn) S.closedVenue = vn.name;
  else if(v) toast('Unknown venue code');
  if(location.hash.includes('partner')) S.route='partner';
  if(location.hash.includes('hq')) S.route='hq';
  render();
  poll();
})();
